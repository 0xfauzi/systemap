"n":"Map review","q":"Who writes and examines the model?","e":[72,74,75,76,77,78,79,80,81]}],"sq":[{"n":"Read the change history","en":"systemap history","s":[{"a":["Agent"],"f":0,"y":"The user runs systemap history with a start date and a sample interval."},{"a":["ChangeDetector"],"f":7,"y":"The change detector selects one commit per interval from git, in date order. Each interval has the same weight."},{"a":["FactsExtractor"],"f":41,"y":"The extractor reads facts from each git revision. It does not read the working tree. The cache stores facts in .systemap/facts."},{"a":["ChangeDetector"],"f":48,"y":"The comparison uses the components in the model for all samples. Each component has module claims for its function."},{"a":["ChangeDetector"],"f":69,"y":"The report shows the largest changes first: component size, imports between components and commits that added modules."}]},{"n":"Compare a plan with source changes","en":"plan in systemap.jev_cli","s":[{"a":["Agent"],"f":0,"y":"Before source changes, the agent or maintainer runs systemap plan with a task description and --provider."},{"a":["SecondOpinion"],"f":80,"y":"The plan projection reads component functions from the model. Its question uses the model component names."},{"a":["SecondOpinion"],"f":26,"y":"Jev receives a question about the probability of a change in each component for this task."},{"a":["TypeSafe"],"f":27,"y":"Jev gives a weight for each component. The projection selects components at or above the measured threshold."},{"a":["SecondOpinion"],"f":81,"y":"The report shows flows, sequences and rules for each selected component. The command writes the projection in .systemap/plans."},{"a":["ChangeDetector"],"f":41,"y":"After source changes, systemap plan --check compares the initial facts with the new facts. It identifies changed components outside the plan."}]},{"n":"Get an audit or issue assessment","en":"audit in systemap.jev_cli","s":[{"a":["Agent"],"f":0,"y":"If the maintainer asks and no judgement findings are open, the agent runs systemap audit --provider jev. For an issue, the maintainer runs systemap triage --provider jev."},{"a":["SecondOpinion"],"f":80,"y":"The second-opinion process reads components, explanations, flows, invariants and facts. It makes a different question for each claim."},{"a":["SecondOpinion"],"f":26,"y":"The command sends questions without cached answers to Jev through HTTPS. audit --dry-run shows the data before transmission."},{"a":["TypeSafe"],"f":27,"y":"Jev gives a probability or choice. The cache stores each answer by model release."},{"a":["SecondOpinion"],"f":81,"y":"The report shows Jev findings that are different from map claims, or three components with the largest probabilities for triage. The agent corrects or answers findings."}]},{"n":"Make the initial map","en":"systemap init","s":[{"a":["Agent"],"f":0,"y":"The agent runs systemap init. The command writes the configuration, initial model and workflow."},{"a":["CLI"],"f":4,"y":"init installs the skill directory in the project. systemap skill installs it again on request."},{"a":["Skill"],"f":72,"y":"The skill gives the procedure: extraction, model draft, check, judgement, render and second examination."},{"a":["FactsExtractor"],"f":5,"y":"systemap extract reads modules, public names, imports and entry points from the source tree."},{"a":["Agent"],"f":74,"y":"The agent runs systemap suggest for initial module groups. Then the agent writes components, flows, explanations and sequences in map/model.py, without positions."},{"a":["Placer"],"f":46,"y":"systemap place sets regions and component cards on a grid. It keeps spaces between regions and writes positions in the model file."},{"a":["Check"],"f":68,"y":"systemap check gives each error and necessary action, and the result of each import rule. systemap rules gives only the import rule results. The agent makes changes until module coverage is N/N and layout checks give no errors."}]},{"n":"Examine the model and refresh the map","en":"systemap judgement","s":[{"a":["Agent"],"f":0,"y":"The agent runs systemap judgement."},{"a":["Judgement"],"f":40,"y":"Judgement examines fact imports for connections without model flows. It finds entry points without sequences."},{"a":["Judgement"],"f":78,"y":"Findings identify imports between components, entry points without sequence coverage and layers with few flows. The agent corrects or answers each finding."},{"a":["Agent"],"f":74,"y":"The agent adds missing flows and corrects module groups. The agent does the check again. If a full examination finds no necessary changes, stop."},{"a":["Page"],"f":8,"y":"systemap refresh renders the page and figures. systemap describe gives diagram measurements. systemap serve opens the page for examination."},{"a":["Judgement"],"f":79,"y":"The agent records judgement answers in systemap.toml. judgement --strict must give exit code 0. The maintainer examines the answers and writes docs/map in a Git commit."}]},{"n":"Update the map after a module move","en":"systemap delta","s":[{"a":["CI"],"f":1,"y":"A pull request moves a module. The workflow runs systemap delta --base with the base branch. It posts a map-change report."},{"a":["ChangeDetector"],"f":7,"y":"The detector reads facts from both git revisions. It identifies old module claims and the renames that correct them."},{"a":["Check"],"f":70,"y":"The CI job rejects the change if a finding has no answer or if it is necessary to update the map. The job log gives the necessary actions."},{"a":["Agent"],"f":0,"y":"The agent examines delta findings and changed component source. The agent records review digests. The agent runs refresh, check and judgement --strict, then writes docs/map in a Git commit."},{"a":["Page"],"f":67,"y":"The maintainer reads the page. The changed component shows the new source location."}]},{"n":"Read stored source facts","en":"systemap facts","s":[{"a":["Agent"],"f":0,"y":"The agent runs systemap facts with --module or --entry-points. The command reads stored facts and prints the selected record."}]},{"n":"Render the map page","en":"systemap render","s":[{"a":["Agent"],"f":0,"y":"The agent runs systemap render to make the page from stored facts and the model."},{"a":["Page"],"f":8,"y":"The command gives stored facts, the model and the selected theme to the page generator."},{"a":["Schematic"],"f":62,"y":"The page contains the schematic SVG and detail data for its controls."},{"a":["Maintainer"],"f":67,"y":"The maintainer opens the page to examine components, flows and sequences."}]},{"n":"Show the map of the working tree","en":"live in systemap.serve","s":[{"a":["Agent"],"f":0,"y":"The agent or the maintainer runs systemap live. The command supplies the page on 127.0.0.1 and writes one event line for each version."},{"a":["FactsExtractor"],"f":5,"y":"When a watched file changes, or after POST /refresh, the command extracts the facts of the working tree. It does not write the facts file."},{"a":["ChangeDetector"],"f":7,"y":"The detector compares the working tree with the merge base of the base ref and HEAD. The delta lines that need an action are the map updates."},{"a":["Page"],"f":8,"y":"The page generator makes the pages in a temporary directory. The page script loads the page again for each version and keeps the view of the reader."},{"a":["Figures"],"f":9,"y":"The figure generator makes change.svg beside the page. It is the change figure, or the system figure if the comparison has no change."},{"a":["Maintainer"],"f":67,"y":"The maintainer examines the page in a browser while the agent changes the code."}]},{"n":"Write a model file with literal values","en":"convert in systemap.model_convert","s":[{"a":["Agent"],"f":0,"y":"The maintainer examines the code of the model files. Then the maintainer or the agent runs systemap convert with SYSTEMAP_TRUST_MODEL_CODE=1."},{"a":["Config"],"f":53,"y":"The configuration reader runs each model file that the safe reader refuses, one time. It gives the model and its meaning."},{"a":["SecondOpinion"],"f":24,"y":"The command reads the new text without running code. If it gives the same model, the model writer replaces the file."}]},{"n":"Record the review of one target","en":"review in systemap.review","s":[{"a":["Agent"],"f":0,"y":"The agent examines the source and all the claims of one component or one flow. Then the agent runs systemap review for that target."},{"a":["Config"],"f":53,"y":"The command reads the model as data. The model gives the current digest of the target from the source and the claims."},{"a":["SecondOpinion"],"f":24,"y":"The command reads the new text without running code. If only the review value changes, the model writer replaces the file."}]},{"n":"Examine the claims with the agent","en":"decisions in systemap.decisions_cli","s":[{"a":["Agent"],"f":0,"y":"The agent runs systemap decisions pending. The command gives each claim without a current decision, with its source files and their digests."},{"a":["Judgement"],"f":78,"y":"The requests are the open judgement lines, the missing or stale source reviews and the flow reviews that are not current."},{"a":["Agent"],"f":74,"y":"The agent reads the source files and gives one verdict with citations for each request. After a contradicted verdict, the agent corrects the map."},{"a":["Config"],"f":53,"y":"systemap decisions submit rejects incorrect citations and writes nothing. Otherwise, it writes the review digests into the model and the exact answers into systemap.toml."},{"a":["Judgement"],"f":79,"y":"systemap decisions status and systemap judgement show each unknown request. The maintainer examines these claims."}]},{"n":"Make a map figure","en":"systemap figure","s":[{"a":["Agent"],"f":0,"y":"The agent runs systemap figure. The command can use a selected mode and output path."},{"a":["Figures"],"f":9,"y":"The command tells the figure generator to make one diagram from stored facts and the model."},{"a":["Schematic"],"f":63,"y":"The figure uses the schematic SVG, alone or in an HTML figure element."}]},{"n":"Read a finding explanation","en":"systemap explain","s":[{"a":["Agent"],"f":0,"y":"The agent runs systemap explain with a finding kind. The command gives the explanation, cause and necessary action."}]},{"n":"Write a sequence for an entry point","en":"journeys in systemap.jev_cli","s":[{"a":["Agent"],"f":0,"y":"The agent runs systemap journeys for an entry point without a sequence with source review."},{"a":["SecondOpinion"],"f":12,"y":"The command groups entry points without sequences by component. If the environment sets SYSTEMAP_TRUST_AGENT_COMMAND=1, it tells the configured coding agent to read the source for one group."},{"a":["SecondOpinion"],"f":81,"y":"The command validates the sequence draft against model components and flows. Then it writes the draft for the maintainer to examine."}]},{"n":"Divide the map into nested parts","en":"parts in systemap.parts_cli","s":[{"a":["Agent"],"f":0,"y":"The agent runs systemap parts --stub CARD for a component with more than ten modules."},{"a":["CLI"],"f":51,"y":"The command loads the map and finds the parent components that have a flow or an import across the boundary of the component."},{"a":["Placer"],"f":3,"y":"The stub gets one component for each module group of systemap suggest, the actors, and positions from systemap place."},{"a":["Check"],"f":6,"y":"The command examines the stub with the model checks and the nesting check. If a check gives a problem, it writes no file."},{"a":["Judgement"],"f":10,"y":"After the agent sets map= on the component, systemap parts writes the part plan to map/parts/plan.json with two digests."},{"a":["Agent"],"f":78,"y":"The agent gives each nested part its record from the plan. Then systemap parts --results examines each result file against the plan."}]}],"sm":[{"n":"Source review of a component","of":"Model","st":[{"id":"missing","c":0,"r":0,"first":1,"sym":"card_review.MISSING","y":"The component has no source_review value."},{"id":"current","c":1,"r":0,"first":0,"sym":"card_review.CURRENT","y":"The source_review value is the current digest."},{"id":"stale","c":1,"r":1,"first":0,"sym":"card_review.STALE","y":"The source_review value is not the current digest."}],"tr":[{"a":0,"b":1,"l":"review","c":"systemap review COMPONENT writes the current digest in the model file."},{"a":1,"b":2,"l":"source or claims change","c":"The source or the claims of the component change. Then the digest is different."},{"a":2,"b":1,"l":"review","c":"A person or an agent examines the claims again. Then systemap review writes the current digest."}]},{"n":"Review of a flow","of":"Model","st":[{"id":"missing","c":0,"r":0,"first":1,"sym":"flow_review.MISSING","y":"The flow has no source records or no review digest."},{"id":"current","c":1,"r":0,"first":0,"sym":"flow_review.CURRENT","y":"The review digest agrees with the claim and the cited source."},{"id":"stale","c":1,"r":1,"first":0,"sym":"flow_review.STALE","y":"The cited source or the flow changed after the review."},{"id":"earlier","c":2,"r":0,"first":0,"sym":"flow_review.EARLIER","y":"The review is earlier than source tracking. Its digest does not identify the examined source."}],"tr":[{"a":0,"b":1,"l":"review --flow","c":"systemap review --flow writes the review digest of the flow."},{"a":1,"b":2,"l":"cited source or flow changes","c":"The cited source or the flow claim changes. Then the digest is different."},{"a":2,"b":1,"l":"review --flow","c":"A person or an agent examines the flow claim again."},{"a":3,"b":1,"l":"review --flow","c":"A new review identifies the examined source."}]}]},{"id":"Page","size":[1154,686],"boxes":[{"id":"part","n":"PAGE","u":"","b":[248.0,28.0,658,516]}],"regions":[{"id":"data","n":"DATA","b":[268.0,320.0,190,112]},{"id":"canvas","n":"CANVAS PAGE","b":[506.0,320.0,380,204]},{"id":"linked","n":"LINKED PAGE","b":[268.0,80.0,190,204]},{"id":"shared","n":"SHARED PARTS","b":[506.0,80.0,190,112]}],"cards":[{"id":"LinkedViews","b":[288,120,150,56],"k":"component","p":"The linked views","d":"Gives the Sequences view and the Changes view of the linked page: their toolbars, their panels, their data and their scripts.","as":["examined","current"],"m":[]},{"id":"PageAssets","b":[526,120,150,56],"k":"component","p":"The page assets","d":"Gives the parts that the two pages share: the styles, the icons, the Find list, the font, the content security policy and the script of the live page.","as":["examined","current"],"m":[]},{"id":"LinkedPage","b":[288,212,150,56],"k":"component","p":"The linked page","d":"Makes the linked page: one page for each map, with the SVG diagram, the reading panel, the guide, the map controls and the phone layout. Gives its text tools to the other parts.","as":["examined","current"],"m":[]},{"id":"FactsExtractor","b":[28,244,150,44],"k":"actor","p":"The source records","d":"Reads the syntax tree and writes module records. Records public names, imports, the lines that use imported names, test imports and entry points. Records the source files and TypeScript syntax that it cannot read or parse, with the cause of each record. Resolves self-name imports and package.json subpath imports to modules of the same package. An import of a declaration file is not an unresolved import. Relative imports and path aliases can also name declaration files. A comment directly before a TypeScript variable does not become the module description without a blank line or a module tag. Records each re-export target without a module one time for each statement and target, with its line and names. An indirect re-export through an import gives the same record. A license notice does not become a module description. Records a digest of the configuration values that extraction reads. Writes the Python syntax digest and the api fingerprints from the syntax text of systemap, and takes the Python signatures and constant values from the source text. Thus these values are the same on each supported Python version. A Python syntax node that the syntax text does not know stops the extraction. Reads stored facts through systemap facts. The language adapters give the language operations and the facts with the same meaning for each language. For the upgrade of answers from 2.0.0, the Python adapter gives each module record with the ast.unparse text of 2.0.0 for the signatures and constant values. The stored facts do not change.","as":[],"m":[]},{"id":"Config","b":[404,614,150,44],"k":"actor","p":"The configuration","d":"Reads systemap.toml or [tool.systemap] in pyproject.toml with default values. Finds package roots, test files and source-language settings. For TypeScript, selects the one source folder of the tsconfig include entries, then src, then the repository root. Finds the type-test files for test_patterns. Finds the configuration files that the language reads, with the tsconfig files that extends and references name. Keeps judgement answers and reasons. Rejects unknown keys, values of the wrong form and entries without reasons. Reads the writing profile, the [rules] table, the [render] table and the decision provider. Reads model files as data and does not run their code. Reads the invariants and import rules of each map from its contract file. From 2.0, also reads them from the model file, and rejects a map whose two files both give them. systemap refresh and systemap extract move them from the model file to the contract file one time. Reads a repository file only if the file is a regular file in the repository. Reads and writes a cache file or an output file only in the repository. A write replaces a link and does not write to the target of the link. Rejects a configured cache, output or model path that is not in the repository. Writes a cache file or an output file through a temporary file of each writer. On Windows, if os.replace gives PermissionError, waits and tries os.replace again a small number of times. A new file gets the mode of a usual write. A file that is present keeps its mode. Holds a lock on a cache file while one process reads or changes it. Makes the write lock .systemap/write.lock with O_EXCL, so that only one command at a time writes the shared files. A second process does not wait. It stops with an error that gives the lock path and the command that holds the lock. In one process, an inner lock continues. A lock that a stopped process left stays until a person removes it. If .systemap/.gitignore does not exist, systemap init and a write of the answer cache, the facts cache or the decision store in .systemap write that file with the line *. systemap convert writes a model file that needs code again with literal values. systemap review writes the current review digest of one component or one flow into the model file. It holds the lock of each model file of the map from the read to the write. A dry run takes no lock. When systemap refresh and systemap extract move a contract or record the source records of flow reviews, they also hold the lock of each model file from the read to the write. In each release, systemap refresh and systemap extract record the source records of each flow review before source tracking one time. They also write the current evidence digest of each answer from 2.0.0 that agrees with the source one time. For the 2.0.0 form of the evidence, they get the ast.unparse text of the Python signatures and constant previews from the source again. Adds exact answers with citations to systemap.toml and keeps the other text of the file. Rejects a family answer with a previous name of a decision finding kind. Rejects a package root that is not in the repository. Rejects a model value that does not agree with the type of its field. Rejects a configured output file that is not in the output directory. Rejects a layer ID that is not a safe name and a component ID that is a key of the page data.","as":[],"m":[]},{"id":"PageData","b":[288,360,150,56],"k":"component","p":"The page data","d":"Makes the data of the pages. For the canvas page, gives one object with the cards, the flow paths, the sequences, the state machines, the changes and the details of all maps. For the linked page, gives the module records.","as":["examined","current"],"m":[]},{"id":"CanvasControls","b":[526,360,150,56],"k":"component","p":"The canvas controls","d":"Gives the script parts for the keyboard, the touch screen, the list of the map tree and Find.","as":["examined","current"],"m":[]},{"id":"CanvasViews","b":[716,360,150,56],"k":"component","p":"The canvas views","d":"Gives the script parts for the views of the canvas page: the layers, the Sequences view, the States view, the Changes view, the caption and the Details panel.","as":["examined","current"],"m":[]},{"id":"Judgement","b":[28,314,150,44],"k":"actor","p":"The review findings","d":"Gives findings for examination: single-module components, incorrect groups, missing flow explanations, layers, entry points, imports and TypeScript records. Uses accepted answers and policies. Reports stale component source reviews and source records outside the flow endpoints or the sequence step components. Gives each flow review earlier than source tracking as a row with a label, not as a finding. A change to a cited module opens the flow review again. With --strict, returns exit code 1 for findings without answers or for a model without components. Gives the cause, the fix line and the source location rows of each unknown surface finding. Gives a contract reason finding for each invariant or import rule without a reason. A finding line contains no line number, source excerpt, parser version or count. The evidence digest of an answer contains the names, imports and entry points that the finding cites. A comment, a function body or a test does not open an answer again. Gives no finding about a test file. Gives an answer item with a previous decision kind name as a stale answer with the current line. With --json, writes the findings, answers and counts as one JSON object. Gives the assurance level and the freshness of each component, flow, invariant and import rule to the JSON object and to the page. Gives the open boundary findings of the map tree to the canvas page. It applies the answers only to the boundary findings, thus it does not make the other findings. An exact answer that also names a different finding needs all findings. Only an import rule with the result pass is established. A current source review or flow review gives examined. All other claims are unknown. With require_reviews, a missing source review is a finding. systemap decisions gives the claims to a coding agent, rejects verdicts without correct citations, records the correct verdicts and shows the unknown claims. With --order-by-drift, puts the stale source review lines in sequence by the drift score from a decision provider. systemap decisions submit holds .systemap/write.lock from the read of the store to the last write. Before the first review write, it takes the lock of each model file that a review can write. The store write reads the store again and keeps the records of the other keys. If the configuration does not load after the answer write, the command restores the previous bytes only if no different writer changed the file. systemap suggest gives initial module groups and the map= file name of each possible nested map. systemap parts writes the part plan of the nested maps of one map: the modules, the module groups, the adjacent components, the flows and imports at each boundary, the entry points, and two digests. A different source fact, or a different contract of the parent map or of a map above it, makes the plan stale. A new commit with the same source facts does not make the plan stale. systemap parts --results examines the result file of each nested part against the plan. In each nested map, gives a boundary flow finding for a flow across the boundary of the map that the parent map does not show in the same direction, and for a parent flow that no nested flow shows. Gives a boundary import finding for an import across the boundary when the nested map has no actor or no flow for the imported component. The owner of an imported module is the component that claims it in the nearest map above the nested map.","as":[],"m":[]},{"id":"CanvasPage","b":[526,452,150,56],"k":"component","p":"The canvas page","d":"Makes the canvas page from the page data and the script parts. Makes the header, and a page for each nested map that goes to the canvas page. Gives the pages of a map tree to the commands. If the configuration sets canvas = false, starts the linked page.","as":["examined","current"],"m":[]},{"id":"CanvasDrawing","b":[716,452,150,56],"k":"component","p":"The canvas drawing","d":"Gives the script parts that draw the maps on the canvas: the scene, the cards, the flow lines, the labels, the stored images, the fades, the text, the ports and the legend.","as":["examined","current"],"m":[]},{"id":"Schematic","b":[28,384,150,44],"k":"actor","p":"The map diagram","d":"Makes the SVG diagram. Uses card symbols for component kinds and line colors for flow kinds. Shows connected components, selected sequence steps and the change marks of a revision comparison. Gives the script that changes the layer, the map position and the zoom. When the zoom is less than 100 percent, makes the map labels larger. Rejects a theme value that contains a mark that can change the HTML or the CSS. Rejects a theme key that is not a safe name and a card symbol that is not available. The inspector gives the assurance level and the freshness of each component, flow and invariant.","as":[],"m":[]},{"id":"Model","b":[976,279,150,44],"k":"actor","p":"The map schema","d":"Gives the schema for containers, regions, components, flows, invariants, import rules and meaning tables. Gives the schema for state machines: the states of one item of a component, each with its source symbol, and the transitions with their causes. Finds a state machine that names an unknown component, state, flow or sequence. Gives the contract of each map: its invariants and import rules, each with a reason. Gives a finding for a rule without a reason. Does model checks. Sets flow evidence states and source review digests. A flow review digest contains the flow claim and the digests of the cited modules. Loads child maps when a component card opens a map. With a map ID, loads only that map, its parent maps and its nested maps, and does not read the files of other maps. A card that opens a map must have an ID that is one path segment. Replaces a model file through a temporary file. If a replacement fails, restores the previous files. Holds the lock <model file>.lock of each model file during the write, so that two processes can write two different model files at the same time. Gives the file name of a nested map: the map ID in lower case, with _ in place of each /, and .py. Gives the files of the part plan and of the result files in map/parts. Refuses a stem of a nested map that is reserved, that is the same as a different stem, or whose prefix is the start of a different stem. To find the modules that the module claims of a component cover, it uses a sorted list of the module names. It keeps this list for each of the last 4 module lists that it examined.","as":[],"m":[]},{"id":"ChangeDetector","b":[28,454,150,44],"k":"actor","p":"The source comparison","d":"Compares source revisions, or a revision and the working tree. Shows changed public names, module renames and components that import changed modules. systemap delta gives findings and necessary actions. With --comment, it writes the architecture summary of a pull request: the contract changes, the map changes and the rule results, with the assurance level of each item. With a page URL in the configuration of the base commit, the comment also has a link to the Changes view. systemap history shows changes to the software structure through time. Resolves each revision from a person to a commit SHA before the other Git commands use it. A working-tree path can have a Git filter that only the repository configuration gives. Such a path is not a changed path, and its change is not known.","as":[],"m":[]},{"id":"CLI","b":[580,614,150,44],"k":"actor","p":"The commands","d":"Gives commands to make, examine, render and update the map. Map check errors give a nonzero exit code. A second-opinion error can leave the map check report without errors. systemap live serves the page of the working tree on the loopback address and makes it again after each change. It writes the pages only in its directory and removes the pages of removed maps. The page servers do not supply a file that a symbolic link puts in a location that is not in the served directory. They refuse a POST request and a GET request for /events from a page of a different web site. systemap extract, refresh, render and figure --out hold the write lock .systemap/write.lock. If a different command holds that lock, they stop with exit code 1 and write no file. With --map ID, check, judgement, rules, place, describe, journeys, review and decisions pending and status read only the model files of that map, of its parent maps and of its nested maps, and report only that map. Such a run does not examine the pages or the entry coverage. refresh, extract and decisions submit refuse --map. render, refresh and live write the canvas page, and a small page that goes to the canvas page for each nested map. With [render] canvas = false, they write the linked pages and give one notice line. systemap parts --stub CARD writes a stub of a new nested map with positions. It writes no file if the stub has a check problem or if the file exists.","as":[],"m":[]},{"id":"Check","b":[756,614,150,44],"k":"actor","p":"The map checks","d":"Does checks of module coverage, entries, interfaces, TypeScript records, layout, routes, labels, text, meaning and outputs. Compares the import rules with the resolved imports. Compares the source symbol of each state of a state machine with the constants in the facts. Gives each contract rule without a reason, and does not reject the map for it. Gives all findings. Returns exit code 1 if there are errors.","as":[],"m":[]},{"id":"Figures","b":[976,500,150,44],"k":"actor","p":"The document figures","d":"Makes a figure from the same diagram generator for a document. Shows the system, components in a plan, or a change. Gives an SVG file with a background. Shows the model and configuration text as HTML text. Rejects an SVG ID that is not a safe HTML ID.","as":[],"m":[]},{"id":"Maintainer","b":[976,430,150,44],"k":"actor","p":"The maintainer","d":"Examines judgement answers. Corrects model errors and writes the map in a Git commit.","as":[],"m":[]}],"flows":[{"s":"PageData","t":"CanvasPage","a":"canvas data","k":"data","p":[[413.0,416.0],[413.0,464.0],[526.0,464.0]],"say":"The canvas page puts the data object in the page one time."},{"s":"CanvasDrawing","t":"CanvasPage","a":"drawing script","k":"data","p":[[716.0,480.0],[676.0,480.0]],"say":"The canvas page joins the drawing parts into one script."},{"s":"CanvasControls","t":"CanvasPage","a":"control script","k":"data","p":[[601.0,416.0],[601.0,452.0]],"say":"The canvas page joins the control parts into the same script."},{"s":"CanvasViews","t":"CanvasPage","a":"view script","k":"data","p":[[716.0,404.0],[680.0,404.0],[680.0,464.0],[676.0,464.0]],"say":"The canvas page joins the view parts into the same script."},{"s":"CanvasPage","t":"LinkedPage","a":"render","k":"control","p":[[526.0,472.0],[460.0,472.0],[460.0,248.0],[438.0,248.0]],"say":"If the configuration sets canvas = false, the page writer makes the linked pages."},{"s":"PageAssets","t":"CanvasPage","a":"font, policy","k":"data","p":[[676.0,156.0],[687.0,156.0],[687.0,472.0],[676.0,472.0]],"say":"The canvas page gets the font and the content security policy."},{"s":"PageAssets","t":"LinkedPage","a":"styles, icons","k":"data"
