<title>systemap Map Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one screen. A calm plan of the system; a path lights only when the reader asks for it. */
:root{
  --bg:#F1EFEC;--map:#F4F2EF;--surface:#FCFAF7;--card:#FFFEFC;--line:#E2DFDA;--line-2:#CFCBC5;
  --ink:#1D1B17;--ink-2:#524F4A;--ink-3:#77726B;--wire:#A9A49C;--tint:rgba(29,27,23,.028);
  --data:#0B6B58;--control:#B4483F;--judge:#7A5C00;--context:#4F5BD5;--tool:#96600A;--brand:#F2B33D;--halo:rgba(242,179,61,.38);
  --shadow:0 1px 0 rgba(29,27,23,.04),0 12px 32px -18px rgba(29,27,23,.28);
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --head:"Inter Tight","Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0E0C;--map:#12110F;--surface:#161411;--card:#1C1A17;--line:#27241F;--line-2:#3A362F;
  --ink:#F1EDE4;--ink-2:#BEB8AC;--ink-3:#8F887B;--wire:#5E5A52;--tint:rgba(241,237,228,.035);
  --data:#3CC4A6;--control:#E0776B;--judge:#D6B24A;--context:#9AA4FF;--tool:#E0A44A;--brand:#FCB442;--halo:rgba(252,180,66,.32);
  --shadow:0 1px 0 rgba(0,0,0,.4),0 14px 36px -18px rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0E0C;--map:#12110F;--surface:#161411;--card:#1C1A17;--line:#27241F;--line-2:#3A362F;
  --ink:#F1EDE4;--ink-2:#BEB8AC;--ink-3:#8F887B;--wire:#5E5A52;--tint:rgba(241,237,228,.035);
  --data:#3CC4A6;--control:#E0776B;--judge:#D6B24A;--context:#9AA4FF;--tool:#E0A44A;--brand:#FCB442;--halo:rgba(252,180,66,.32);
  --shadow:0 1px 0 rgba(0,0,0,.4),0 14px 36px -18px rgba(0,0,0,.8);color-scheme:dark}
html,body{height:100%}
body{background:var(--map);color:var(--ink);font:13px/1.45 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-width:0}
.bar{display:flex;align-items:stretch;gap:20px;height:48px;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.brand{display:flex;align-items:center;gap:9px;font:600 14px/1 var(--head);letter-spacing:-.01em;flex:none}
.brand svg{display:block}
.tabs{display:flex;align-items:stretch;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;padding:0 11px;color:var(--ink-3);font-weight:500;white-space:nowrap;transition:color .16s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:11px;right:11px;bottom:-1px;height:2px;background:var(--ink);border-radius:2px 2px 0 0}
.tab i{font:500 10.5px/1 var(--mono);font-style:normal;color:var(--ink-3);margin-left:6px;font-variant-numeric:tabular-nums}
.views{display:flex;align-self:center;padding:2px;border:1px solid var(--line);border-radius:9px;background:var(--map);flex:none}
.views button{height:26px;padding:0 11px;border-radius:7px;color:var(--ink-3);font-weight:500;transition:color .16s,background .16s,box-shadow .16s}
.views button:hover{color:var(--ink)}
.views button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(29,27,23,.12)}
.bar__end{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--ink-3);font:400 11px/1 var(--mono);flex:none}
.stage{position:relative;min-height:0;overflow:hidden;overflow:clip}
svg#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
svg#map.drag{cursor:grabbing}
/* the headline: the question that the screen answers, set as type on the ground */
.ask{position:absolute;top:22px;left:max(24px,env(safe-area-inset-left,0px));right:24px;pointer-events:none;max-width:560px}
.ask__k{font:500 10.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.ask__k button{pointer-events:auto;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.ask__k button:hover{color:var(--ink)}
.ask__k b{font-weight:500;color:var(--ink)}
.ask__q{margin:9px 0 0;font:600 23px/1.18 var(--head);letter-spacing:-.018em;text-wrap:balance}
.ask__n{margin-top:8px;color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.ask.beside{max-width:290px;top:30px}
.ask::before{content:"";position:absolute;inset:-22px -40px -26px -40px;z-index:-1;background:radial-gradient(closest-side,var(--map) 62%,transparent);opacity:.92}
.ask>*{transition:opacity .18s,transform .18s}
.ask.swap>*{opacity:0;transform:translateY(3px)}
/* the reading line: the map says one sentence for the thing under the pointer */
.say{position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom,0px));transform:translate(-50%,6px);max-width:min(760px,calc(100% - 32px));
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;justify-content:center;padding:10px 16px;border-radius:12px;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .14s,transform .14s;text-align:center}
.say.on{opacity:1;transform:translate(-50%,0)}
.say b{font:600 13px/1.3 var(--head);white-space:nowrap}
.say .arr{color:var(--ink-3);margin:0 2px}
.say code{font:500 11px/1 var(--mono);padding:3px 6px;border-radius:5px;background:var(--tint);border:1px solid var(--line);white-space:nowrap}
.say code::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;background:var(--k,var(--wire));vertical-align:1px}
.say span{color:var(--ink-2);min-width:0}
.zoom{position:absolute;left:max(20px,env(safe-area-inset-left,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:2px;
  color:var(--ink-3);font:500 11px/1 var(--mono);font-variant-numeric:tabular-nums}
.zoom button{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink-2);font:400 17px/1 var(--ui)}
.zoom button:hover{background:var(--tint);color:var(--ink)}
.zoom span{min-width:38px;text-align:center}
.key{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:max(24px,env(safe-area-inset-bottom,0px));display:flex;gap:14px;color:var(--ink-3);font-size:11.5px;transition:right .24s cubic-bezier(.2,.8,.2,1)}
.key i{display:inline-block;width:14px;height:2px;border-radius:2px;margin-right:6px;vertical-align:3px;background:var(--k)}
.app.open .key{right:calc(380px + 20px)}
/* the map */
.dots{fill:var(--line-2);opacity:.6}
#world *{vector-effect:non-scaling-stroke}
.lvl{transition:opacity .12s linear}
.sys{fill:var(--surface);stroke:var(--line);stroke-width:1;filter:drop-shadow(0 10px 18px rgba(29,27,23,.06))}
.sysname{font:500 9.5px/1 var(--mono);letter-spacing:.11em;fill:var(--ink-3)}
.syssub{font:400 10px/1 var(--ui);fill:var(--ink-3)}
.region{fill:var(--tint)}
.rname{font:500 9px/1 var(--mono);letter-spacing:.11em;fill:var(--ink-3)}
.rnum{font:500 8.5px/1 var(--mono);fill:var(--ink-3)}
.rring{fill:none;stroke:var(--line-2)}
.card{cursor:pointer;outline:none}
.card rect.box{fill:var(--card);stroke:var(--line-2);stroke-width:1;transition:stroke .16s,fill .2s,opacity .2s}
.card text.nm{font:600 13.5px/1 var(--head);letter-spacing:-.008em;fill:var(--ink);transition:fill .2s,opacity .2s}
.card text.pl{font:400 10px/1 var(--ui);fill:var(--ink-3);transition:opacity .2s}
.card rect.ring{fill:none;stroke:var(--halo);stroke-width:5;opacity:0;transition:opacity .16s}
.card.actor rect.box{fill:var(--map);stroke:var(--ink-3)}
.card:hover rect.box,.card.lit rect.box{stroke:var(--ink)}
.card.sel rect.ring,.card:focus-visible rect.ring{opacity:1}
.card.sel rect.box{stroke:var(--ink);stroke-width:1.5}
.card.quiet rect.box{fill:transparent;stroke:var(--line-2);stroke-opacity:.7}
.card.quiet text.nm{fill:var(--ink-3);opacity:.6;font-weight:500}
.card.quiet text.pl{opacity:0}
.card.quiet:hover rect.box{stroke:var(--line-2);fill:var(--card)}
.card.quiet:hover text.nm{opacity:1;fill:var(--ink)}
/* a card that opens a map: a second edge behind it, and the count of its parts */
.card rect.under{fill:var(--card);stroke:var(--line-2);stroke-width:1;transition:opacity .2s}
.card.quiet rect.under{opacity:0}
.card text.kind{font:500 8.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;fill:var(--ink-3);text-anchor:end;transition:opacity .2s}
.card.quiet text.kind{opacity:.5}
.card text.parts{font:500 9.5px/1 var(--mono);fill:var(--ink-3);text-anchor:end;transition:opacity .2s}
.lvl.inside .card.host>*{opacity:0}
.gflows{transition:opacity .16s}
.gflows.swap{opacity:0}
.thumb .flow,.thumb text,.thumb .rring,.thumb .region{opacity:0}
.thumb .card rect.box{stroke-opacity:.6}
.lvl.far .card text.pl{opacity:0}
.lvl.far .card text.nm{transform:translateY(6px)}
.card text.nm{transition:fill .2s,opacity .2s,transform .2s}
.lvl.focus .card:not(.lit):not(.sel){opacity:.34}
.card{transition:opacity .2s}
.flow{transition:opacity .2s}
.flow path.case{fill:none;stroke:var(--map);stroke-opacity:var(--rest,1);stroke-width:5;stroke-linejoin:round}
.lvl.dense:not(.focus) .flow text{opacity:0}
.flow path.wire{fill:none;stroke:var(--wire);stroke-opacity:var(--rest,1);stroke-width:1.15;stroke-linejoin:round;transition:stroke .16s,stroke-width .16s}
.flow path.hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer;pointer-events:stroke}
.flow polygon,.flow circle{fill:var(--ink-3);fill-opacity:var(--ends,1);transition:fill .16s}
.flow text{font:500 11px/1 var(--ui);fill:var(--ink-2);paint-order:stroke;stroke:var(--map);stroke-width:5px;stroke-linejoin:round;text-anchor:middle;pointer-events:none;transition:opacity .16s,fill .16s}
.flow text.rest0{opacity:0}
.flow.lit path.wire{stroke:var(--k);stroke-width:2;stroke-opacity:1}
.flow.lit polygon,.flow.lit circle{fill:var(--k);fill-opacity:1}
.flow.lit text{opacity:1;fill:var(--ink)}
.flow.lit path.case{stroke-width:7;stroke-opacity:1}
/* a sequence: the lines of the steps before the current step stay dark, the current step has its color */
.flow.done path.wire{stroke:var(--ink-2);stroke-width:1.6;stroke-opacity:1}
.flow.done polygon,.flow.done circle{fill:var(--ink-2);fill-opacity:1}
.lvl.stepping .flow:not(.lit):not(.done){opacity:.4}
.lvl.stepping .flow.done text,.lvl.stepping .flow.lit text{opacity:1}
/* the list at the left: the sequences, or the state machines */
.rail{position:absolute;left:max(24px,env(safe-area-inset-left,0px));top:232px;bottom:74px;width:292px;overflow:auto;display:none;flex-direction:column;gap:1px;scrollbar-width:thin;overscroll-behavior:contain}
.app[data-mode="seq"] .rail,.app[data-mode="states"] .rail{display:flex}
.rail button{display:flex;justify-content:space-between;gap:12px;align-items:baseline;text-align:left;padding:7px 10px;margin-left:-10px;border-radius:8px;color:var(--ink-2);transition:background .12s,color .12s;flex:none}
.rail button:hover{background:var(--tint);color:var(--ink)}
.rail button[aria-current="true"]{color:var(--ink);font-weight:600;background:var(--tint)}
.rail button i{font:500 10.5px/1 var(--mono);font-style:normal;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
/* the steps of a sequence */
.stepper{position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(780px,calc(100% - 32px));display:none;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.app[data-mode="seq"] .stepper{display:flex}
.app[data-mode="seq"] .say{bottom:max(96px,env(safe-area-inset-bottom,0px))}
.app[data-mode="seq"] .key,.app[data-mode="states"] .key,.app:not([data-mode="map"]) .note{display:none}
.stepper .n{font:500 11px/1 var(--mono);color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.stepper p{margin:0;flex:1;min-width:0;color:var(--ink);line-height:1.4}
.stepper .nav{display:flex;gap:4px;flex:none}
.stepper button{height:32px;min-width:32px;padding:0 10px;border-radius:9px;border:1px solid var(--line-2);color:var(--ink-2);font-weight:500;transition:background .12s,color .12s,transform .12s}
.stepper button:hover:not(:disabled){background:var(--tint);color:var(--ink)}
.stepper button:disabled{opacity:.4;cursor:default}
.stepper button.go{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.stepper button.go:hover:not(:disabled){background:var(--ink);color:var(--surface);transform:translateY(-1px)}
.forms{display:flex;padding:2px;border:1px solid var(--line);border-radius:9px;background:var(--map);flex:none}
.stepper .forms button{height:26px;min-width:0;padding:0 9px;border:0;border-radius:7px;color:var(--ink-3);font-size:12px}
.stepper .forms button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(29,27,23,.12)}
.app[data-mode="seq"][data-form="diagram"] svg#board{display:block}
.app[data-mode="seq"][data-form="diagram"] svg#map{visibility:hidden}
.app[data-mode="seq"][data-form="diagram"] .zoom{display:none}
svg#board .qrow{pointer-events:auto;cursor:pointer}
.qlife{stroke:var(--line-2);stroke-width:1}
.qbead circle{fill:var(--map);stroke:var(--ink-3);stroke-width:1}
.sedge .qbead text{font:600 10.5px/1 var(--mono);fill:var(--ink-2);text-anchor:middle;stroke:none}
.sedge.done path.wire{stroke:var(--ink-2);stroke-width:1.6}
.sedge.done polygon{fill:var(--ink-2)}
.sedge.lit .qbead circle{fill:var(--k,var(--ink));stroke:var(--k,var(--ink))}
.sedge.lit .qbead text{fill:var(--surface);stroke:none}
#bworld.stepping .sedge:not(.lit):not(.done){opacity:.38}
.qrow rect{fill:transparent}
.qrow:hover rect{fill:var(--tint)}
.dots2{display:flex;gap:4px;flex:none}
.dots2 i{width:6px;height:6px;border-radius:50%;background:var(--line-2);transition:background .16s,transform .16s}
.dots2 i.was{background:var(--ink-2)}
.dots2 i.now{background:var(--ink);transform:scale(1.35)}
/* the state machine */
svg#board{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}
svg#board .snode,svg#board .hit,svg#board .mcell,svg#board .mname{pointer-events:auto}
.rail{z-index:2}
.app[data-mode="states"] svg#board,.app[data-mode="focus"] svg#board,.app[data-mode="history"] svg#board{display:block}
.app[data-mode="states"] svg#map,.app[data-mode="focus"] svg#map,.app[data-mode="history"] svg#map{visibility:hidden}
.app[data-mode="states"] .zoom,.app[data-mode="focus"] .zoom,.app[data-mode="history"] .zoom,.app[data-mode="focus"] .key,.app[data-mode="history"] .key{display:none}
.app[data-mode="focus"] .rail{display:flex}
svg#board .fnode,svg#board .hcell,svg#board .hrow{pointer-events:auto}
/* focus: one card in the middle, what it receives at the left, what it gives at the right */
.fnode{cursor:pointer;outline:none;transition:opacity .2s}
.fnode rect{fill:var(--card);stroke:var(--line-2);stroke-width:1;transition:stroke .16s}
.fnode text{font:600 13px/1 var(--head);fill:var(--ink);text-anchor:middle}
.fnode.far rect{fill:transparent}.fnode.far text{font-weight:500;fill:var(--ink-2)}
.fnode.mid rect{stroke:var(--ink);stroke-width:1.6}
.fnode.mid text{font-size:16px}
.fnode:hover rect,.fnode.lit rect,.fnode:focus-visible rect{stroke:var(--ink)}
.fhalo{fill:none;stroke:var(--halo);stroke-width:6}
.fcol{font:500 9.5px/1 var(--mono);letter-spacing:.1em;fill:var(--ink-3);text-anchor:middle}
.fmore{font:400 11px/1 var(--ui);fill:var(--ink-3);text-anchor:middle}
.sedge.thin path.wire{stroke-opacity:.55;stroke-width:1}
.sedge.lit path.wire{stroke:var(--k,var(--ink))}
.sedge.lit polygon{fill:var(--k,var(--ink))}
/* history: one row for each component, one column for each part of the time */
.hcell rect{fill:var(--ink);transition:stroke .12s}
.hcell:hover rect{stroke:var(--brand);stroke-width:2}
.hborn{fill:var(--brand);pointer-events:none}
.hbar{fill:var(--line-2)}
.hrow{font:500 11.5px/1 var(--ui);fill:var(--ink-2);text-anchor:end;cursor:pointer}
.hrow:hover{fill:var(--ink)}
.hsum{font:400 10.5px/1 var(--mono);fill:var(--ink-3);font-variant-numeric:tabular-nums}
.haxis{font:400 10px/1 var(--mono);fill:var(--ink-3);text-anchor:middle}
/* the matrix: each flow is one mark, in the row of the card that gives and the column of the card that receives */
.mgrid{fill:none;stroke:var(--line);stroke-width:1}
.mband{fill:var(--tint)}
.mname{font:500 11.5px/1 var(--ui);fill:var(--ink-2);cursor:default;transition:fill .12s}
.mname.actor{font-style:italic}
.mname.lit{fill:var(--ink);font-weight:600}
.mgroup{font:500 9px/1 var(--mono);letter-spacing:.1em;fill:var(--ink-3)}
.mcell{cursor:pointer}
.mcell rect.bg{fill:transparent}
.mcell:hover rect.bg,.mcell.lit rect.bg{fill:var(--halo)}
.mcell rect.dot{transition:transform .12s}
.mrow{fill:var(--tint);opacity:0;transition:opacity .12s;pointer-events:none}
.mrow.on{opacity:1}
.snode{cursor:default;outline:none}
.snode rect{fill:var(--card);stroke:var(--ink-3);stroke-width:1;transition:stroke .16s,stroke-width .16s}
.snode text.nm{font:600 15px/1 var(--head);fill:var(--ink);text-anchor:middle}
.snode text.sy{font:400 10.5px/1 var(--mono);fill:var(--ink-3);text-anchor:middle}
.snode:hover rect,.snode.lit rect,.snode:focus-visible rect{stroke:var(--ink);stroke-width:1.6}
.sedge path.wire{fill:none;stroke:var(--wire);stroke-width:1.3;transition:stroke .16s,stroke-width .16s}
.sedge path.hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer;pointer-events:stroke}
.sedge polygon{fill:var(--ink-3);transition:fill .16s}
.sedge text{font:500 12px/1 var(--ui);fill:var(--ink-2);text-anchor:middle;paint-order:stroke;stroke:var(--map);stroke-width:6px;stroke-linejoin:round;pointer-events:none}
.sedge.lit path.wire{stroke:var(--ink);stroke-width:2.2}
.sedge.lit polygon{fill:var(--ink)}
.sedge.lit text{fill:var(--ink)}
.sstart{fill:var(--ink-3)}
#bworld.focus .sedge:not(.lit),#bworld.focus .snode:not(.lit){opacity:.38}
.sedge,.snode{transition:opacity .2s}
.lvl.focus .flow:not(.lit){opacity:.22}
.lvl.focus .flow:not(.lit) text{opacity:0}
.flow.draw path.wire{animation:draw .42s cubic-bezier(.3,.7,.2,1) both}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
/* the inspector */
.side{position:absolute;top:0;right:0;bottom:0;width:380px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);
  transform:translateX(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;min-width:0}
.app.open .side{transform:none}
.side__head{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.side__k{display:flex;align-items:center;gap:8px;font:500 10.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.side__k button{margin-left:auto;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--ink-2)}
.side__k button:hover{background:var(--tint);color:var(--ink)}
.side h2{margin:0;font:600 21px/1.2 var(--head);letter-spacing:-.015em}
.side__p{color:var(--ink-2)}
.side__state{display:flex;gap:6px;align-items:center;color:var(--ink-3);font-size:11.5px;margin-top:2px}
.side__state i{width:7px;height:7px;border-radius:50%;background:var(--data)}
.side__state i.no{background:var(--line-2)}
.side__body{overflow:auto;padding:16px 22px 28px;display:grid;gap:22px;min-height:0;overscroll-behavior:contain}
.side__d{margin:0;color:var(--ink-2);max-width:62ch}
.side__d.clip{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more{color:var(--ink-3);font-size:12px;text-decoration:underline;text-underline-offset:3px;justify-self:start;margin-top:-16px}
.more:hover{color:var(--ink)}
.enter{justify-self:start;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:9px;background:var(--ink);color:var(--surface);font:600 12.5px/1 var(--head);transition:transform .12s}
.enter:hover{transform:translateY(-1px)}
.enter:active{transform:none}
.enter svg{display:block}
.sec h3{margin:0 0 6px;display:flex;justify-content:space-between;font:500 10.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.sec h3 span{font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:14px minmax(0,1fr);gap:2px 10px;width:100%;text-align:left;padding:9px 8px;margin:0 -8px;border-radius:8px;transition:background .12s}
.row:hover,.row:focus-visible{background:var(--tint)}
.row i{grid-row:1/3;width:10px;height:2px;border-radius:2px;background:var(--k);margin-top:9px}
.row b{font:600 13px/1.35 var(--head)}
.row b em{font-style:normal;font-weight:400;color:var(--ink-3);font-family:var(--ui)}
.row small{font-size:12px;color:var(--ink-2);line-height:1.45}
.mods{display:flex;flex-wrap:wrap;gap:5px}
.mods code{font:400 10.5px/1 var(--mono);padding:4px 6px;border-radius:5px;border:1px solid var(--line);color:var(--ink-2)}
.note{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:64px;font-size:11.5px;color:var(--ink-3);max-width:230px;line-height:1.5;transition:opacity .2s}
.note.gone{opacity:0}
@media (max-width:720px){
  .bar{gap:12px}.brand span,.bar__end,.note,.key{display:none}
  .ask{top:14px}.ask__q{font-size:19px}
  .ask__n{display:none}.app.open .ask__q{font-size:15px}
  .views button{padding:0 8px}.rail{top:118px;bottom:auto;left:16px;right:16px;width:auto;flex-direction:row;gap:6px;overflow-x:auto;overflow-y:hidden;padding-bottom:4px}
  .rail button{margin:0;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
  .stepper{flex-wrap:wrap}.stepper p{flex-basis:100%;order:3}
  .app[data-mode="seq"] .zoom{display:none}
  .side{top:auto;height:62%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(104%)}
  .say{bottom:max(60px,env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script id="data" type="application/json">{"sets":[{"name":"systemap","note":"the map of systemap itself","maps":[{"id":"","size":[1174,892],"boxes":[{"id":"outside","n":"OUTSIDE THE PACKAGE","u":"External components","b":[16,16,190,644]},{"id":"systemap","n":"SYSTEMAP","u":"One CLI process","b":[310,16,848,860]}],"regions":[{"id":"operate","n":"OPERATE","b":[330,80,380,204]},{"id":"gather","n":"SOURCE DATA","b":[758,80,190,204]},{"id":"mean","n":"MODEL","b":[330,320,190,204]},{"id":"draw","n":"DIAGRAM","b":[758,320,380,204]},{"id":"keep","n":"MAP CHECKS","b":[330,560,380,296]}],"cards":[{"id":"Placer","b":[350,120,150,56],"k":"component","p":"The card positions","d":"Calculates initial card positions in a grid of regions. Scores region orders with route collisions, route errors, bends and length. Writes positions in map/model.py. Then loads the file again. If a value is different, restores the previous file. Holds the lock of the model file from the read to the end of the write. With --all, keeps only pinned positions.","as":["examined","current"],"m":[]},{"id":"CLI","b":[540,120,150,56],"k":"component","p":"The commands","d":"Gives commands to make, examine, render and update the map. Map check errors give a nonzero exit code. A second-opinion error can leave the map check report without errors. systemap live serves the page of the working tree on the loopback address and makes it again after each change. It writes the pages only in its directory and removes the pages of removed maps. The page servers do not supply a file that a symbolic link puts in a location that is not in the served directory. They refuse a POST request and a GET request for /events from a page of a different web site. systemap extract, refresh, render and figure --out hold the write lock .systemap/write.lock. If a different command holds that lock, they stop with exit code 1 and write no file. With --map ID, check, judgement, rules, place, describe, journeys, review and decisions pending and status read only the model files of that map, of its parent maps and of its nested maps, and report only that map. Such a run does not examine the pages or the entry coverage. refresh, extract and decisions submit refuse --map. render, refresh and live write the canvas page, and a small page that goes to the canvas page for each nested map. With [render] canvas = false, they write the linked pages and give one notice line. systemap parts --stub CARD writes a stub of a new nested map with positions. It writes no file if the stub has a check problem or if the file exists.","as":["examined","current"],"m":[]},{"id":"FactsExtractor","b":[778,120,150,56],"k":"component","p":"The source records","d":"Reads the syntax tree and writes module records. Records public names, imports, the lines that use imported names, test imports and entry points. Records the source files and TypeScript syntax that it cannot read or parse, with the cause of each record. Resolves self-name imports and package.json subpath imports to modules of the same package. An import of a declaration file is not an unresolved import. Relative imports and path aliases can also name declaration files. A comment directly before a TypeScript variable does not become the module description without a blank line or a module tag. Records each re-export target without a module one time for each statement and target, with its line and names. An indirect re-export through an import gives the same record. A license notice does not become a module description. Records a digest of the configuration values that extraction reads. Writes the Python syntax digest and the api fingerprints from the syntax text of systemap, and takes the Python signatures and constant values from the source text. Thus these values are the same on each supported Python version. A Python syntax node that the syntax text does not know stops the extraction. Reads stored facts through systemap facts. The language adapters give the language operations and the facts with the same meaning for each language. For the upgrade of answers from 2.0.0, the Python adapter gives each module record with the ast.unparse text of 2.0.0 for the signatures and constant values. The stored facts do not change.","as":["examined","current"],"m":[]},{"id":"OpenAI","b":[36,184,150,44],"k":"actor","p":"The OpenAI service","d":"The OpenAI Decisions API. Gives typed answers about the map only when the user selects the openai provider.","as":[],"m":[]},{"id":"Scaffold","b":[350,212,150,56],"k":"component","p":"The initial files","d":"Writes the initial configuration, model, contract file, output directory and workflow. On a pull request, the workflow writes the architecture summary to the job summary. For a branch of the same repository, it also writes the summary as one comment and changes that comment on each push. Prints a suggested CODEOWNERS line for the contract file and does not write CODEOWNERS. The model has regions on a grid with spaces between them. Does not replace files. Does not write systemap.toml when pyproject.toml has a [tool.systemap] table. Writes no file if a symbolic link puts a file in a location that is not in the repository. Writes test_patterns for the type-test files that the language adapter finds. If no package root is found, prints the cause and the [package_roots] table to write.","as":["examined","current"],"m":[]},{"id":"Config","b":[540,212,150,52],"k":"store","p":"The configuration","d":"Reads systemap.toml or [tool.systemap] in pyproject.toml with default values. Finds package roots, test files and source-language settings. For TypeScript, selects the one source folder of the tsconfig include entries, then src, then the repository root. Finds the type-test files for test_patterns. Finds the configuration files that the language reads, with the tsconfig files that extends and references name. Keeps judgement answers and reasons. Rejects unknown keys, values of the wrong form and entries without reasons. Reads the writing profile, the [rules] table, the [render] table and the decision provider. Reads model files as data and does not run their code. Reads the invariants and import rules of each map from its contract file. From 2.0, also reads them from the model file, and rejects a map whose two files both give them. systemap refresh and systemap extract move them from the model file to the contract file one time. Reads a repository file only if the file is a regular file in the repository. Reads and writes a cache file or an output file only in the repository. A write replaces a link and does not write to the target of the link. Rejects a configured cache, output or model path that is not in the repository. Writes a cache file or an output file through a temporary file of each writer. On Windows, if os.replace gives PermissionError, waits and tries os.replace again a small number of times. A new file gets the mode of a usual write. A file that is present keeps its mode. Holds a lock on a cache file while one process reads or changes it. Makes the write lock .systemap/write.lock with O_EXCL, so that only one command at a time writes the shared files. A second process does not wait. It stops with an error that gives the lock path and the command that holds the lock. In one process, an inner lock continues. A lock that a stopped process left stays until a person removes it. If .systemap/.gitignore does not exist, systemap init and a write of the answer cache, the facts cache or the decision store in .systemap write that file with the line *. systemap convert writes a model file that needs code again with literal values. systemap review writes the current review digest of one component or one flow into the model file. It holds the lock of each model file of the map from the read to the write. A dry run takes no lock. When systemap refresh and systemap extract move a contract or record the source records of flow reviews, they also hold the lock of each model file from the read to the write. In each release, systemap refresh and systemap extract record the source records of each flow review before source tracking one time. They also write the current evidence digest of each answer from 2.0.0 that agrees with the source one time. For the 2.0.0 form of the evidence, they get the ast.unparse text of the Python signatures and constant previews from the source again. Adds exact answers with citations to systemap.toml and keeps the other text of the file. Rejects a family answer with a previous name of a decision finding kind. Rejects a package root that is not in the repository. Rejects a model value that does not agree with the type of its field. Rejects a configured output file that is not in the output directory. Rejects a layer ID that is not a safe name and a component ID that is a key of the page data.","as":["examined","current"],"m":[]},{"id":"ChangeDetector","b":[778,212,150,56],"k":"component","p":"The source comparison","d":"Compares source revisions, or a revision and the working tree. Shows changed public names, module renames and components that import changed modules. systemap delta gives findings and necessary actions. With --comment, it writes the architecture summary of a pull request: the contract changes, the map changes and the rule results, with the assurance level of each item. With a page URL in the configuration of the base commit, the comment also has a link to the Changes view. systemap history shows changes to the software structure through time. Resolves each revision from a person to a commit SHA before the other Git commands use it. A working-tree path can have a Git filter that only the repository configuration gives. Such a path is not a changed path, and its change is not known.","as":["examined","current"],"m":[]},{"id":"TypeSafe","b":[36,276,150,44],"k":"actor","p":"The Jev service","d":"The Jev model through the TypeSafe HTTP API. Gives typed answers about the map only when an option on the command line asks for a request and the environment has the key.","as":[],"m":[]},{"id":"Skill","b":[350,360,150,56],"k":"component","p":"The agent procedure","d":"Gives the procedure for the agent: extraction, model draft, check, judgement, render and second examination. Gives completion conditions, output requirements and maintenance instructions. Stores text files and references in the package. Writes no file if a symbolic link puts a skill file in a location that is not in the selected directory.","as":["examined","current"],"m":[]},{"id":"Figures","b":[778,360,150,56],"k":"component","p":"The document figures","d":"Makes a figure from the same diagram generator for a document. Shows the system, components in a plan, or a change. Gives an SVG file with a background. Shows the model and configuration text as HTML text. Rejects an SVG ID that is not a safe HTML ID.","as":["examined","current"],"m":[]},{"id":"Page","b":[968,360,150,56],"k":"component","p":"The map page","d":"Makes the map page. Uses no external files. Gives one data object with all maps of a map tree for the canvas: the cards, the flow routes, the ports of each nested map and their boundary findings. By default, makes the canvas page: one canvas element for all maps of the tree, with the data object one time. The page of each nested map is a redirect page that goes to the canvas page with the map ID and the hash of the link in the URL hash. The URL hash #changes opens the Changes view. With [render] canvas = false, makes one linked page for each map in place of the canvas page. The linked page shows the map, the sequences and the revision changes in separate views, with a panel for components, flows and source records. Its rules list gives the assurance level and the freshness of each invariant and import rule. On a phone, it shows the regions of the top map as a grid. The canvas page draws only the cards and flows on the screen, and draws at half resolution while the camera moves. While the camera moves, it can draw a large map from images of the full map, which it makes in slices in the free time of the frames. Each boundary flow fades in and out with the camera, and the text of each card fades in and out with the zoom. A hidden list after the canvas gives the maps, the cards and the flows for a screen reader. Each link in the list moves the camera to its item. On the canvas page, Tab moves the keyboard focus through the cards of the current map in reading order, and Enter goes into the focused card or selects it. On a touch screen, a tap selects a card, and a second tap on a card that opens a map goes into it. A header over the canvas has the views Map, Sequences and Changes and the layers. In the Map view, a layer shows only its flows, and the cards that no flow of the layer touches become quiet. The page opens with the layer System context when the top map has flows in that layer. Each change of the view fades. In the Sequences view, a toolbar under the header selects a sequence of a map of the tree. The camera goes to that map, the route shows with a number at each step, and the other cards and flows of the map become quiet. In the Steps mode, Previous and Next move the camera to the cards of each step. In the Changes view of the canvas page, each card shows its change mark, only the flows of changed source with structural or declared evidence show, and a card that opens a map with map changes in it or below it shows \"changed inside\". A bar under the header gives the changes of the current map in words. When the map changes are not known, the bar gives the reason. The layer and the view also control which boundary flows show. On the canvas page, Ctrl K opens the Find dialog for the cards and the flows of all maps. A result in a different map moves the camera to that card and selects it. A click with a mouse also selects a card and opens the Details panel. On a wide screen, the open panel makes the canvas narrower, so it covers no card. The canvas has a dot grid and a legend with the count of the flows of the layer. In the Map view, a selected card keeps its flows at full contrast, and the other flows and cards of its map go to low contrast. The header of the canvas page has the theme, Reduce motion, the Keyboard keys and the source of the map. The Details panel gives the selected card: its flows with their evidence, its sequences, its rules with their assurance, and its source records. In the Sequences view, with no selected card, the panel gives the steps of the sequence in order. The Sequences toolbar can show the steps as a sequence diagram in place of the route on the map. When a map has a state machine, the header has a States view. It draws the states and the transitions of one machine, and for a transition, the panel gives the flow and the sequence that show the same change. A caption at the right of the path gives the question of the layer, or the sentence of the step. The canvas data has only the open boundary findings of the judgement. In the Map view, the actor card of each open boundary finding has a dotted ring and a short text, and the list of the tree and the live region give the open findings.","as":["examined","current"],"m":[]},{"id":"CI","b":[36,412,150,44],"k":"actor","p":"The CI process","d":"Runs the map check for each pull request. Rejects the pull request if the map is not correct.","as":[],"m":[]},{"id":"Model","b":[350,452,150,52],"k":"store","p":"The map schema","d":"Gives the schema for containers, regions, components, flows, invariants, import rules and meaning tables. Gives the schema for state machines: the states of one item of a component, each with its source symbol, and the transitions with their causes. Finds a state machine that names an unknown component, state, flow or sequence. Gives the contract of each map: its invariants and import rules, each with a reason. Gives a finding for a rule without a reason. Does model checks. Sets flow evidence states and source review digests. A flow review digest contains the flow claim and the digests of the cited modules. Loads child maps when a component card opens a map. With a map ID, loads only that map, its parent maps and its nested maps, and does not read the files of other maps. A card that opens a map must have an ID that is one path segment. Replaces a model file through a temporary file. If a replacement fails, restores the previous files. Holds the lock <model file>.lock of each model file during the write, so that two processes can write two different model files at the same time. Gives the file name of a nested map: the map ID in lower case, with _ in place of each /, and .py. Gives the files of the part plan and of the result files in map/parts. Refuses a stem of a nested map that is reserved, that is the same as a different stem, or whose prefix is the start of a different stem. To find the modules that the module claims of a component cover, it uses a sorted list of the module names. It keeps this list for each of the last 4 module lists that it examined.","as":["examined","current"],"m":[]},{"id":"Router","b":[778,452,150,56],"k":"component","p":"The flow paths","d":"Calculates flow paths through spaces between component cards. Finds paths outside unrelated cards and regions. Calculates label positions and gives errors for route or label collisions. A label position with fewer paths of other flows through it has priority.","as":["examined","current"],"m":[]},{"id":"Schematic","b":[968,452,150,56],"k":"component","p":"The map diagram","d":"Makes the SVG diagram. Uses card symbols for component kinds and line colors for flow kinds. Shows connected components, selected sequence steps and the change marks of a revision comparison. Gives the script that changes the layer, the map position and the zoom. When the zoom is less than 100 percent, makes the map labels larger. Rejects a theme value that contains a mark that can change the HTML or the CSS. Rejects a theme key that is not a safe name and a card symbol that is not available. The inspector gives the assurance level and the freshness of each component, flow and invariant.","as":["examined","current"],"m":[]},{"id":"Maintainer","b":[36,504,150,44],"k":"actor","p":"The maintainer","d":"Examines judgement answers. Corrects model errors and writes the map in a Git commit.","as":[],"m":[]},{"id":"Agent","b":[36,596,150,44],"k":"actor","p":"The coding agent","d":"Reads the skill. Runs the commands and writes the model and the contract. Corrects check errors and records judgement answers.","as":[],"m":[]},{"id":"Judgement","b":[350,600,150,56],"k":"component","p":"The review findings","d":"Gives findings for examination: single-module components, incorrect groups, missing flow explanations, layers, entry points, imports and TypeScript records. Uses accepted answers and policies. Reports stale component source reviews and source records outside the flow endpoints or the sequence step components. Gives each flow review earlier than source tracking as a row with a label, not as a finding. A change to a cited module opens the flow review again. With --strict, returns exit code 1 for findings without answers or for a model without components. Gives the cause, the fix line and the source location rows of each unknown surface finding. Gives a contract reason finding for each invariant or import rule without a reason. A finding line contains no line number, source excerpt, parser version or count. The evidence digest of an answer contains the names, imports and entry points that the finding cites. A comment, a function body or a test does not open an answer again. Gives no finding about a test file. Gives an answer item with a previous decision kind name as a stale answer with the current line. With --json, writes the findings, answers and counts as one JSON object. Gives the assurance level and the freshness of each component, flow, invariant and import rule to the JSON object and to the page. Gives the open boundary findings of the map tree to the canvas page. It applies the answers only to the boundary findings, thus it does not make the other findings. An exact answer that also names a different finding needs all findings. Only an import rule with the result pass is established. A current source review or flow review gives examined. All other claims are unknown. With require_reviews, a missing source review is a finding. systemap decisions gives the claims to a coding agent, rejects verdicts without correct citations, records the correct verdicts and shows the unknown claims. With --order-by-drift, puts the stale source review lines in sequence by the drift score from a decision provider. systemap decisions submit holds .systemap/write.lock from the read of the store to the last write. Before the first review write, it takes the lock of each model file that a review can write. The store write reads the store again and keeps the records of the other keys. If the configuration does not load after the answer write, the command restores the previous bytes only if no different writer changed the file. systemap suggest gives initial module groups and the map= file name of each possible nested map. systemap parts writes the part plan of the nested maps of one map: the modules, the module groups, the adjacent components, the flows and imports at each boundary, the entry points, and two digests. A different source fact, or a different contract of the parent map or of a map above it, makes the plan stale. A new commit with the same source facts does not make the plan stale. systemap parts --results examines the result file of each nested part against the plan. In each nested map, gives a boundary flow finding for a flow across the boundary of the map that the parent map does not show in the same direction, and for a parent flow that no nested flow shows. Gives a boundary import finding for an import across the boundary when the nested map has no actor or no flow for the imported component. The owner of an imported module is the component that claims it in the nearest map above the nested map.","as":["examined","current"],"m":[]},{"id":"SecondOpinion","b":[540,600,150,56],"k":"component","p":"The external advice","d":"Sends different questions about the map to a decision provider. Drift ordering sends questions only for a provider with a measured result. Jev is the default provider. OpenAI Decisions answers only when the user selects it. Refuses an answer that does not agree with its question. Stores answers in a cache. Does not read or write a cache file that Git tracks, unless the environment sets SYSTEMAP_TRUST_TRACKED_CACHE=1. Without this setting, it also does not use a cache file in a repository if Git cannot tell if it tracks the file. Can tell a coding agent to read the source and write text. Starts the agent command of the repository only if the environment sets SYSTEMAP_TRUST_AGENT_COMMAND=1. The component itself starts only with an explicit option on the command line: --provider for audit, plan and triage, and --decide or --order-by-drift for the other commands. A key or a configuration value does not start a request. Does not control map checks.","as":["examined","current"],"m":[]},{"id":"Check","b":[350,692,150,56],"k":"component","p":"The map checks","d":"Does checks of module coverage, entries, interfaces, TypeScript records, layout, routes, labels, text, meaning and outputs. Compares the import rules with the resolved imports. Compares the source symbol of each state of a state machine with the constants in the facts. Gives each contract rule without a reason, and does not reject the map for it. Gives all findings. Returns exit code 1 if there are errors.","as":["examined","current"],"m":[]},{"id":"Describe","b":[350,784,150,56],"k":"component","p":"The diagram measurements","d":"Gives diagram measurements as text: cards per region, path bends and lengths, label positions and layer contents. Gives information for examination. rce and claims."},{"s":"Model","t":"Schematic","a":"topology, meaning","k":"data","p":[[450,504],[450,518],[993,518],[993,508]],"say":"The diagram shows model positions and relationships. The flow list shows model text."},{"s":"Model","t":"Check","a":"model","k":"data","p":[[500,486],[520,486],[520,704],[500,704]],"say":"The check finds model errors before it makes a diagram. It also does module coverage, entry and interface checks."},{"s":"Model","t":"CLI","a":"loaded map","k":"data","p":[[425,452],[425,427],[712,427],[712,132],[690,132]],"say":"The commands load the model and meaning through the map tree. They find model errors before the render operation."},{"s":"Config","t":"Placer","a":"model file lock","k":"control","p":[[540,222],[511,222],[511,164],[500,164]],"say":"The placer holds the lock of a model file from the read to the end of the write. Thus a different command cannot write that model file at the same time."},{"s":"Config","t":"Model","a":"path and model","k":"data","p":[[565,264],[565,442],[475,442],[475,452]],"say":"The map tree reads the model path from the configuration. The loader validates MODEL and MEANING against their schema."},{"s":"Model","t":"Page","a":"layers","k":"data","p":[[375,452],[375,441],[993,441],[993,416]],"say":"The page uses model components, layers, sequences and invariants for its controls and text."},{"s":"Model","t":"Figures","a":"layers","k":"data","p":[[450,452],[450,426],[803,426],[803,416]],"say":"The figure uses model components and layers to select the diagram and caption."},{"s":"Model","t":"Describe","a":"readings","k":"data","p":[[500,478],[529,478],[529,796],[500,796]],"say":"Describe reads model components, flows, regions and layers to give diagram measurements."},{"s":"Router","t":"Schematic","a":"routes, labels","k":"data","p":[[928,480],[968,480]],"say":"The router gives paths and label positions. It gives route and label errors with necessary actions."},{"s":"Router","t":"Describe","a":"gutters, seats","k" ainer opens the page and examines layers and sequences. Map position and zoom controls show diagram data."},{"s":"Check","t":"Agent","a":"the fix","k":"data","p":[[350,704],[161,704],[161,640]],"say":"Each error has a necessary action. The agent changes the model until coverage and layout checks give no errors."},{"s":"ChangeDetector","t":"Agent","a":"change history","k":"data","p":[[853,268],[853,290.7],[640,290.7],[640,530.7],[339,530.7],[339,559],[161,559],[161,596]],"say":"delta gives change findings with necessary actions. history shows intervals with the largest changes first, with the commits for each interval."},{"s":"Check","t":"CI","a":"verdict","k":"data","p":[[350,712],[244.3,712],[244.3,450],[186,450]],"say":"Exit code 1 rejects the pull request. The message gives the necessary command."},{"s":"Judgement","t":"ChangeDetector","a":"judgement data","k":"data","p":[[500,620],[511,620],[511,585],[745,585],[745,302.3],[803,302.3],[803,268]],"say":"Delta uses judgement answer rules and import groups. Its report uses explanations for finding kinds."},{"s":"Skill","t":"Agent","a":"procedure","k":"judge","p":[[350,404],[220.7,404],[220.7,610],[186,610]],"say":"The skill gives the procedure, schema, example, second examination and output requirements to the agent."},{"s":"Skill","t":"SecondOpinion","a":"language policy","k":"data","p":[[500,404],[590,404],[590,600]],"say":"The configured coding-agent request reads the packaged language policy. The request and cache key contain that policy."},{"s":"Agent","t":"Model","a":"map/model.py","k":"judge","p":[[186,602],[315.3,602],[315.3,494],[350,494]],"say":"The agent writes module groups, flows, explanations, sequences and invariants in map/model.py."},{"s":"Maintainer","t":"Model","a":"corrections","k":"judge","p":[[186,510],[375,510],[375,504]],"say":"The maintainer corrects model errors. The maintainer controls the model after examination."},{"s":"Model","t":"Judgement","a":"model","k":"judge","p":[[500,494],[511,4
