<svg id="lessonmap" class="scene" xmlns="http://www.w3.org/2000/svg" viewBox="-26 -26 1332 752" preserveAspectRatio="xMidYMid meet" tabindex="0" role="application" aria-label="Structure: What are the parts, and where does each sit? Every card, and only the edges of the Structure reading, each labelled with what it carries."><rect x="-26" y="-26" width="1332" height="752" fill="#121417"/><title>Structure: What are the parts, and where does each sit?</title><defs><marker id="lessonmap-m-structure" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#d8d3c6"/></marker><marker id="lessonmap-m-system" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#8fb0c4"/></marker><marker id="lessonmap-m-data" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#8fbfa6"/></marker><marker id="lessonmap-m-control" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#c9ae7c"/></marker><marker id="lessonmap-m-judge" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#d39a8c"/></marker><marker id="lessonmap-m-change" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#d97b6c"/></marker><marker id="lessonmap-m-reach" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#e0a458"/></marker></defs><style>#lessonmap .node{transition:opacity .18s ease;cursor:pointer}#lessonmap .node.dim{opacity:.16}#lessonmap .node.quiet{opacity:.42}#lessonmap .node.subject .node__box{stroke:var(--subject)}#lessonmap .node.subject rect.node__mark{stroke:var(--subject)}#lessonmap .node.subject path.node__mark{fill:var(--subject)}#lessonmap .node.sel .node__box{stroke:#e0a458;stroke-width:2.6}#lessonmap .node.meas .node__box{stroke:#8fb0c4;stroke-width:2.2}#lessonmap .node.acts .node__box{stroke:#e0a458;stroke-width:2.4}#lessonmap .node__ring{display:none;fill:none;stroke:#8fb0c4;stroke-width:1.6}#lessonmap .node.meas .node__ring{display:inline}#lessonmap .node.tagged [data-layer=job]{opacity:0}#lessonmap .node:focus-visible{outline:none}#lessonmap .node:focus-visible .node__box{stroke:#e0a458;stroke-width:2.6}#lessonmap .flow{transition:opacity .18s ease}#lessonmap .flow.off,#lessonmap .flowlbl.off{display:none}#lessonmap .flow.dim{opacity:.07}#lessonmap .flow.hot{opacity:1;stroke-opacity:1;stroke-width:2.6;stroke-dasharray:8 6;animation:systemapflow 1.1s linear infinite}#lessonmap .flow.peek{stroke-width:3.4}#lessonmap .flowlbl{transition:opacity .15s ease;pointer-events:none}#lessonmap .flowlbl.dim{opacity:.08}#lessonmap .flowlbl.hot{opacity:1}#lessonmap .vtag rect{stroke-width:1}#lessonmap .vtag text{font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:11.0px;font-weight:500;text-anchor:middle}#lessonmap{width:100%;height:auto;display:block;overflow:hidden;touch-action:none;cursor:grab}#lessonmap.panning{cursor:grabbing}#lessonmap .zone__h{cursor:zoom-in;-webkit-user-select:none;user-select:none}@keyframes systemapflow{to{stroke-dashoffset:-14}}@media print{#lessonmap .view{transform:none!important}}@media (prefers-reduced-motion:reduce){#lessonmap .flow.hot{animation:none;stroke-dasharray:none}#lessonmap .node,#lessonmap .flow,#lessonmap .flowlbl{transition:none}}</style><g class="view"><rect x="16" y="16" width="200" height="668" rx="6" fill="#15181c" stroke="#3a4149" stroke-width="1.2"/><text x="29.0" y="35.0" class="t0">OUTSIDE THE PACKAGE</text><text x="29.0" y="49.0" class="t1">the people and the runner that</text><text x="29.0" y="61.0" class="t1">use it</text><rect x="240" y="16" width="1024" height="668" rx="6" fill="#16191d" stroke="#2f353d" stroke-width="1.2"/><text x="253.0" y="35.0" class="t0">SYSTEMAP</text><text x="253.0" y="49.0" class="t1">one command-line process; nothing is fetched, nothing is served</text><g data-layer="zones"><rect x="264" y="44" width="976" height="106" rx="5" fill="none" stroke="#858a92" stroke-opacity=".28" stroke-width="1" stroke-dasharray="3 4"/><g class="zone__h" data-zone="operate"><circle cx="281" cy="60" r="8.5" fill="#121417" stroke="#858a92" stroke-opacity=".5"/><text x="281.0" y="64.0" class="t2">1</text><text x="295.0" y="64.0" class="t0">OPERATE</text></g><rect x="280" y="190" width="380" height="125" rx="5" fill="none" stroke="#858a92" stroke-opacity=".28" stroke-width="1" stroke-dasharray="3 4"/><g class="zone__h" data-zone="gather"><circle cx="297" cy="206" r="8.5" fill="#121417" stroke="#858a92" stroke-opacity=".5"/><text x="297.0" y="210.0" class="t2">2</text><text x="311.0" y="210.0" class="t0">GATHER</text></g><rect x="850" y="190" width="380" height="125" rx="5" fill="none" stroke="#858a92" stroke-opacity=".28" stroke-width="1" stroke-dasharray="3 4"/><g class="zone__h" data-zone="mean"><circle cx="867" cy="206" r="8.5" fill="#121417" stroke="#858a92" stroke-opacity=".5"/><text x="867.0" y="210.0" class="t2">3</text><text x="881.0" y="210.0" class="t0">MEAN</text></g><rect x="280" y="350" width="380" height="290" rx="5" fill="none" stroke="#858a92" stroke-opacity=".28" stroke-width="1" stroke-dasharray="3 4"/><g class="zone__h" data-zone="draw"><circle cx="297" cy="366" r="8.5" fill="#121417" stroke="#858a92" stroke-opacity=".5"/><text x="297.0" y="370.0" class="t2">4</text><text x="311.0" y="370.0" class="t0">DRAW</text></g><rect x="850" y="350" width="380" hei