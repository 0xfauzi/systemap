[project]
name = "systemap"
version = "1.0.3"
description = "The map your coding agent draws of your system: facts read out of the code, meaning authored by the agent, a checker that refuses an incomplete or stale map."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Fauzi" }]
keywords = ["architecture", "coding agents", "diagram", "documentation", "svg", "system map"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/0xfauzi/systemap"
Changelog = "https://github.com/0xfauzi/systemap/blob/main/CHANGELOG.md"

[project.scripts]
systemap = "systemap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/systemap"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"src/systemap/scaffold.py" = ["E501"]
# The map's model is prose held in strings; a sentence is not wrapped.
"map/model.py" = ["E501"]
"tests/**" = ["E501"]

[tool.mypy]
files = ["src/systemap"]
strict = true
