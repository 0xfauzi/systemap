[project]
name = "systemap"
version = "1.2.0"
description = "The map your coding agent draws of your system: facts read out of the code, meaning authored by the agent, a checker that refuses an incomplete or stale map."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Fauzi" }]
keywords = ["architecture", "coding agents", "diagram", "documentation", "svg", "system map"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.optional-dependencies]
typescript = [
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.urls]
Homepage = "https://github.com/0xfauzi/systemap"
Changelog = "https://github.com/0xfauzi/systemap/blob/main/CHANGELOG.md"

[project.scripts]
systemap = "systemap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/systemap"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=4,<5",
    "pytest>=8",
    "ruff>=0.5",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-typescript>=0.23,<0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"src/systemap/scaffold.py" = ["E501"]
# The map's model is prose held in strings; a sentence is not wrapped.
"map/model.py" = ["E501"]
# The Jev experiments hold their questions as prose in strings, like the model.
"bench/jev/*.py" = ["E501"]
"tests/**" = ["E501"]

[tool.mypy]
files = ["src/systemap"]
strict = true

[tool.vulture]
# vulture exits 2 with no paths, which reads as a broken hook rather than a
# finding, so this section is what makes the pre-commit hook usable at all.
# min_confidence 80 keeps it to findings worth reading; a reviewed whitelist.py
# goes in paths once one exists.
min_confidence = 80
paths = ['src']

[tool.codespell]
# raed, recrod and nam are DELIBERATE misspellings in tests that assert the
# closest-match suggestion ("closest: read", "unknown key: nam"). Correcting
# them would break the tests. nd is a Dijkstra variable in route.py.
ignore-words-list = "nam,nd,raed,recrod"
# bench/jev/results holds captured commit subjects and model answers: another
# project's typo in a commit message is evidence, not something to correct.
skip = "uv.lock,*/package-lock.json,.git,bench/jev/results,bench/jev/data"
