name: systemap

# CI compares committed map output with source and tests the package on three operating systems.
# Delta writes one pull-request comment and changes that comment after each push.
# Fork tokens can prevent comments. The log still contains the delta report.
# Installation uses an empty environment and a map copy outside the source checkout.
# Plugin validation rejects all errors and warnings except the documented root CLAUDE.md warning.


on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  systemap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: latest
          enable-cache: true

      - name: Install project
        run: uv sync --frozen --all-extras --dev

      - name: Facts agree with source
        run: |
          uv run systemap extract --check || {
            echo "::error title=Map is stale::The facts are different from the source. Run systemap refresh and commit the output directory."
            exit 1
          }

      - name: Do map consistency checks
        run: |
          uv run systemap check || {
            echo "::error title=Map check::The model has incorrect claims or modules without component claims. See the lines above."
            exit 1
          }

      - name: Do the strict judgement check
        run: |
          uv run systemap judgement --strict || {
            echo "::error title=Judgement::A judgement line has no answer. Act on it or write its answer under [judgement] answered in systemap.toml."
            exit 1
          }

      - name: Do the page output check
        run: |
          uv run systemap render --check || {
            echo "::error title=Map is stale::index.html is different from the rendered page. Run systemap refresh and commit the output directory."
            exit 1
          }

  delta:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # this job posts or updates the delta comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the base and the head commits, for the two extractions

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: latest
          enable-cache: true

      - name: Install project
        run: uv sync --frozen --all-extras --dev

      - name: Show map changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=0
          uv run systemap delta --base "$BASE" --head "$HEAD" --format markdown > delta.md || code=$?
          echo "$code" > delta.code
          if [ ! -s delta.md ]; then
            printf '<!-- systemap delta -->\n## What this change does to the map\n\nsystemap delta could not run (exit %s). See the workflow log.\n' "$code" > delta.md
          fi
          cat delta.md

      - name: Write the report comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          existing="$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq 'map(select(.body | startswith("<!-- systemap delta -->"))) | first | .id // empty' | head -n 1)"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@delta.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@delta.md > /dev/null
          fi || echo "::warning title=Map delta::The report comment could not be written. A fork has a read-only token. See the delta in the step above."

      - name: Reject open map decisions
        run: |
          code="$(cat delta.code)"
          if [ "$code" != "0" ]; then
            echo "::error title=Map delta::The map has open decisions. See the pull-request comment. Act on each line, then run systemap refresh."
          fi
          exit "$code"

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: latest
          enable-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install project
        run: uv sync --frozen --all-extras --dev

      - name: Run tests
        run: uv run pytest -q

      - name: Do the type check
        run: uv run mypy src --strict

      - name: Do the lint check
        run: uv run ruff check .

      - name: Do the format check
        run: uv run ruff format --check src tests map bench

  install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: latest

      - name: Make the wheel
        run: uv build --wheel

      - name: Install the wheel in an empty environment
        run: |
          uv venv --seed venv
          if [ "$RUNNER_OS" = "Windows" ]; then . venv/Scripts/activate; else . venv/bin/activate; fi
          pip install --no-deps dist/systemap-*.whl
          systemap --version
          python -c "import systemap, sys; print(systemap.__version__, sys.version)"

      - name: Run map commands on a copy outside the checkout
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then . venv/Scripts/activate; else . venv/bin/activate; fi
          python -c "import shutil; shutil.copytree('.', '../selfmap', ignore=shutil.ignore_patterns('.git', '.venv', 'venv', 'dist', 'bench', 'node_modules', '__pycache__', '.mypy_cache', '.pytest_cache', '.ruff_cache'))"
          cd ../selfmap
          systemap init
          systemap extract
          systemap refresh
          systemap check
          systemap judgement --strict
          systemap render --check
          systemap describe

  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.278 # zizmor: ignore[adhoc-packages]

      - name: Do the plugin manifest check
        run: python3 scripts/check_plugin_manifest.py .claude-plugin/plugin.json

      - name: Do the marketplace manifest check
        run: python3 scripts/check_plugin_manifest.py .claude-plugin/marketplace.json

      - name: Do the skill check
        run: claude plugin validate skills --strict

      - name: Install the plugin from the checkout marketplace
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config
        run: |
          claude plugin marketplace add ./
          claude plugin install systemap@systemap
          claude plugin list
          claude plugin list --json | jq -e '.[] | select(.id == "systemap@systemap" and .enabled == true)' > /dev/null
