name: systemap

# CI compares committed map output with source and tests the package on three operating systems.
# Delta gives the necessary map updates in the job log. The job fails if the map needs an update.
# The comment job writes the architecture summary of delta as one pull request comment.
# Installation uses an empty environment and a map copy outside the source checkout.
# Plugin validation rejects all errors and warnings except the documented root CLAUDE.md warning.
# The plugin tests run the hooks module of the live map with a fake systemap live process.
# The pre-commit job runs the pre-commit hooks on all files. They include the security hooks.
# Each setup-uv step uses a fixed uv version. The release workflow uses the same version.
# For a pull request from a fork, the base-render job renders the page with the base code.


on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  systemap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Install project
        run: uv sync --frozen --all-extras --dev

      - name: Facts agree with source
        run: |
          uv run systemap extract --check || {
            echo "::error title=Map is stale::The facts are different from the source. Run systemap refresh and commit the output directory."
            exit 1
          }

      - name: Do map consistency checks
        run: |
          uv run systemap check || {
            echo "::error title=Map check::The model has incorrect claims or modules without component claims. See the lines above."
            exit 1
          }

      - name: Do the strict judgement check
        run: |
          uv run systemap judgement --strict || {
            echo "::error title=Judgement::A judgement line has no answer. Act on it or write its answer under [judgement] answered in systemap.toml."
            exit 1
          }

      - name: Do the page output check
        run: |
          uv run systemap render --check || {
            echo "::error title=Map is stale::index.html is different from the rendered page. Run systemap refresh and commit the output directory."
            exit 1
          }

  # The page output check of the systemap job uses the renderer of the pull request.
  # A pull request from a fork can change the renderer and the committed page together.
  # Then that check passes, and the page script is not easy to examine in the diff.
  # This job renders the page of the pull request with the code of the base commit.
  # If the two pages are different, a maintainer must examine the renderer change.
  base-render:
    if: >-
      ${{ github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: pr

      - name: Check out the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.29"
          enable-cache: false

      - name: Install the base code
        working-directory: base
        run: uv sync --frozen

      - name: Do the page output check with the base code
        run: |
          base/.venv/bin/systemap --root pr render --check || {
            echo "::error title=Page from the base code::The renderer of the base commit does not make the committed index.html of this pull request. A maintainer must examine the renderer change and the page."
            exit 1
          }

  delta:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      comment: ${{ steps.delta.outputs.comment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the base and the head commits, for the two extractions

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Install project
        run: uv sync --frozen --all-extras --dev

      - name: Show map changes
        id: delta
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=0
          uv run systemap delta --base "$BASE" --head "$HEAD" --comment comment.md || code=$?
          if [ -s comment.md ]; then
            cat comment.md >> "$GITHUB_STEP_SUMMARY"
            # The comment can contain repository text. A random delimiter is not equal to a line of it.
            delimiter="SYSTEMAP_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            {
              echo "comment<<$delimiter"
              cat comment.md
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          fi
          if [ "$code" = "1" ]; then
            echo "::error title=Map delta::The map needs an update. Do the action in each line above. Then run the command in the last line."
          elif [ "$code" != "0" ]; then
            echo "::error title=Map delta::systemap delta could not run (exit $code). The lines above give the reason."
          fi
          exit "$code"

  # This job writes the architecture summary as one pull request comment.
  # It operates only for a pull request from a branch of this repository. The code of a pull
  # request from a fork can change the comment text. The job summary of the delta job gives the
  # summary for each pull request, also from a fork.
  comment:
    needs: delta
    if: >-
      ${{ !cancelled() && needs.delta.outputs.comment != ''
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # this job posts or updates the summary comment
    steps:
      - name: Architecture summary
        env:
          BODY: ${{ needs.delta.outputs.comment }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          existing="$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq 'map(select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- systemap delta -->")))) | first | .id // empty' | head -n 1)"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$BODY" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY" > /dev/null
          fi || echo "::warning title=Architecture summary::The job could not write the comment. The job summary of the delta job gives the text."

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.29"
          enable-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install project
        run: uv sync --frozen --all-extras --dev

      - name: Run tests
        run: uv run pytest -q

      - name: Do the type check
        run: uv run mypy src --strict

      - name: Do the lint check
        run: uv run ruff check .

      - name: Do the format check
        run: uv run ruff format --check src tests map bench

  install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.29"

      # The release makes the wheel from the source archive, so this job does the same.
      # It also uses the same fixed build dependencies.
      - name: Make the wheel from the source archive
        env:
          UV_BUILD_CONSTRAINT: .github/build-constraints.txt
          UV_REQUIRE_HASHES: "1"
        run: uv build

      - name: Install the wheel in an empty environment
        run: |
          uv venv --seed venv
          if [ "$RUNNER_OS" = "Windows" ]; then . venv/Scripts/activate; else . venv/bin/activate; fi
          pip install --no-deps dist/systemap-*.whl
          systemap --version
          python -c "import systemap, sys; print(systemap.__version__, sys.version)"

      - name: Run map commands on a copy outside the checkout
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then . venv/Scripts/activate; else . venv/bin/activate; fi
          python -c "import shutil; shutil.copytree('.', '../selfmap', ignore=shutil.ignore_patterns('.git', '.venv', 'venv', 'dist', 'bench', 'node_modules', '__pycache__', '.mypy_cache', '.pytest_cache', '.ruff_cache'))"
          cd ../selfmap
          systemap init
          systemap extract
          systemap refresh
          systemap check
          systemap judgement --strict
          systemap render --check
          systemap describe

  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # 2.1.286 is the lowest version that does all steps of this job with the hooks module.
      # Versions 2.1.278 to 2.1.285 have no `claude plugin test` command. The manifest check of
      # 2.1.278 and 2.1.280 also refuses `update($, ...)`, a state function from claude-code.
      # See "Claude Code version for the plugin job" in bench/jev/README.md.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.286 # zizmor: ignore[adhoc-packages]

      - name: Do the plugin manifest check
        run: python3 scripts/check_plugin_manifest.py .claude-plugin/plugin.json

      - name: Do the marketplace manifest check
        run: python3 scripts/check_plugin_manifest.py .claude-plugin/marketplace.json

      - name: Do the skill check
        run: claude plugin validate skills --strict

      - name: Run the plugin tests
        run: claude plugin test .

      - name: Install the plugin from the checkout marketplace
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config
        run: |
          claude plugin marketplace add ./
          claude plugin install systemap@systemap
          claude plugin list
          claude plugin list --json | jq -e '.[] | select(.id == "systemap@systemap" and .enabled == true)' > /dev/null

  # This job runs the hooks of .pre-commit-config.yaml on all files. These hooks include
  # the security hooks: gitleaks, zizmor, actionlint, and shellcheck.
  # The last step runs the manual gitleaks-tree hook. It does a secret scan of the full tree,
  # because a clean checkout has no staged files for the gitleaks hook.
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Install project
        run: uv sync --frozen --all-extras --dev

      - name: Do the pre-commit checks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Do the secret scan of the tree
        run: uv run pre-commit run --hook-stage manual gitleaks-tree --all-files
