name: systemap

# Four things are checked here. The system map under docs/map is generated
# from the code and the model module, committed so the page can be served
# as-is and so the diff between two commits of the facts file records what
# changed about the system; the first job fails when the committed map no
# longer matches the tree or the renderer, and the fix is one command,
# named in the failure. The test suite and the type and lint gates run on
# Linux, macOS and Windows with the oldest and the newest Python the
# package supports. The built wheel is installed into a clean virtual
# environment on each of the three and run on a copy of this repository's
# own map from a directory that is not a checkout. And the repository is
# validated, added and installed as a Claude Code plugin with the CLI.

on:
  push:
    branches: [main]
  pull_request:

# Read-only for every job; the delta job widens it for itself alone.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  systemap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: latest
          enable-cache: true

      - name: Install project
        run: uv sync --frozen --all-extras --dev

      - name: facts match the tree
        run: |
          uv run systemap extract --check || {
            echo "::error title=Map is stale::the facts no longer describe the tree. Run systemap refresh and commit the output directory."
            exit 1
          }

      - name: layout, meaning and coverage are consistent
        run: |
          uv run systemap check || {
            echo "::error title=Map check::the model contradicts itself or leaves a module unmapped; see the lines above."
            exit 1
          }

      - name: every judgement line is answered
        run: |
          uv run systemap judgement --strict || {
            echo "::error title=Judgement::a judgement line is unanswered. Act on it, or answer it under [judgement] answered in systemap.toml."
            exit 1
          }

      - name: page matches the renderer
        run: |
          uv run systemap render --check || {
            echo "::error title=Map is stale::index.html differs from what systemap renders. Run systemap refresh and commit the output directory."
            exit 1
          }

  delta:
    # What the pull request does to the map, as one comment: posted once,
    # then updated in place on every push. The base and head commits reach
    # the command through the environment, never through the template. A
    # pull request from a fork has a read-only token, so the comment step
    # warns instead of failing there; the delta is in the log either way.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # this job posts or updates the delta comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the base and the head commits, for the two extractions

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: latest
          enable-cache: true

      - name: Install project
        run: uv sync --frozen --all-extras --dev

      - name: what this change does to the map
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=0
          uv run systemap delta --base "$BASE" --head "$HEAD" --format markdown > delta.md || code=$?
          echo "$code" > delta.code
          if [ ! -s delta.md ]; then
            printf '<!-- systemap delta -->\n## What this change does to the map\n\nsystemap delta could not run (exit %s); see the workflow log.\n' "$code" > delta.md
          fi
          cat delta.md

      - name: post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          existing="$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq 'map(select(.body | startswith("<!-- systemap delta -->"))) | first | .id // empty' | head -n 1)"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@delta.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@delta.md > /dev/null
          fi || echo "::warning title=Map delta::could not post the comment (a pull request from a fork has a read-only token); the delta is in the step above."

      - name: every line is acted on
        run: |
          code="$(cat delta.code)"
          if [ "$code" != "0" ]; then
            echo "::error title=Map delta::the change needs the map's attention; see the comment on the pull request, act on each line, then run systemap refresh."
          fi
          exit "$code"

  test:
    # The suite, the type check and the linter on every operating system the
    # package claims, with the oldest and the newest Python it supports.
    # UV_PYTHON overrides the repository's .python-version for the whole job,
    # so uv creates the environment with the matrix interpreter. Node is on
    # the runner for the keyboard test, which drives the page's script.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: latest
          enable-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install project
        run: uv sync --frozen --all-extras --dev

      - name: tests
        run: uv run pytest -q

      - name: types
        run: uv run mypy src --strict

      - name: lint
        run: uv run ruff check .

      - name: format
        run: uv run ruff format --check src tests map bench

  install:
    # The wheel, installed with pip into a virtual environment that holds
    # nothing else, run on a copy of this repository's own map from a
    # directory beside the checkout: no .git, no source tree on the path,
    # no uv at run time. init keeps every file that exists and writes the
    # skill; extract reads the facts; refresh renders the page and the
    # figures, since the check refuses a page that is not rendered and the
    # committed page names the commit it was rendered at, which a copy
    # without .git cannot reproduce; check and judgement are the gates a
    # consumer's workflow runs.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: latest

      - name: build the wheel
        run: uv build --wheel

      - name: install the wheel into a clean virtual environment
        run: |
          uv venv --seed venv
          if [ "$RUNNER_OS" = "Windows" ]; then . venv/Scripts/activate; else . venv/bin/activate; fi
          pip install --no-deps dist/systemap-*.whl
          systemap --version
          python -c "import systemap, sys; print(systemap.__version__, sys.version)"

      - name: init, extract, refresh, check on a copy of the self-map beside the checkout
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then . venv/Scripts/activate; else . venv/bin/activate; fi
          python -c "import shutil; shutil.copytree('.', '../selfmap', ignore=shutil.ignore_patterns('.git', '.venv', 'venv', 'dist', 'bench', 'node_modules', '__pycache__', '.mypy_cache', '.pytest_cache', '.ruff_cache'))"
          cd ../selfmap
          systemap init
          systemap extract
          systemap refresh
          systemap check
          systemap judgement --strict
          systemap render --check
          systemap describe

  plugin:
    # The repository is also a Claude Code plugin and its own marketplace.
    # Both manifests, and the skill under skills/, are validated in strict
    # mode so an unrecognised field or a missing description fails here.
    # Then the checkout is added as a marketplace and the plugin installed
    # from it with the CLI, into a configuration directory of its own, and
    # the list must show it enabled: the install proof is mechanical.
    # Adding a marketplace, installing and listing need no login (measured
    # with an empty CLAUDE_CONFIG_DIR on the pinned version), so the job
    # fails when any of the three does.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install the Claude Code CLI
        # A global tool has no lockfile to install from; the version is the
        # one the plugin was validated with locally, bumped on purpose.
        run: npm install -g @anthropic-ai/claude-code@2.1.246 # zizmor: ignore[adhoc-packages]

      - name: plugin manifest
        run: claude plugin validate .claude-plugin/plugin.json --strict

      - name: marketplace manifest
        run: claude plugin validate .claude-plugin/marketplace.json --strict

      - name: skills
        run: claude plugin validate skills --strict

      - name: the checkout as a marketplace, the plugin installed from it, listed
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config
        run: |
          claude plugin marketplace add ./
          claude plugin install systemap@systemap
          claude plugin list
          claude plugin list --json | jq -e '.[] | select(.id == "systemap@systemap" and .enabled == true)' > /dev/null
