<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="systemap: the map your coding agent draws of your system">
  <defs>
    <pattern id="hgrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.3" fill="#222b4d"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#121a3a"/>
    </linearGradient>
    <filter id="hglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="htip" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="htip-dim" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5578"/>
    </marker>
  </defs>
  <rect width="1200" height="400" rx="28" fill="url(#fade)"/>
  <rect width="1200" height="400" rx="28" fill="url(#hgrid)"/>

  <!-- the mark, scaled -->
  <g transform="translate(70,44) scale(0.61)">
    <g fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M256,342 H412 V359" stroke="#4b5578" stroke-dasharray="10 12" marker-end="url(#htip-dim)"/>
      <path d="M256,220 V170 H100 V153" stroke="#2dd4bf" marker-end="url(#htip)"/>
      <path d="M256,220 V170 H412 V153" stroke="#2dd4bf" marker-end="url(#htip)"/>
      <path d="M256,292 V342 H100 V359" stroke="#2dd4bf" marker-end="url(#htip)"/>
    </g>
    <g stroke-width="4">
      <rect x="40" y="80" width="120" height="72" rx="16" fill="#101a3a" stroke="#2dd4bf"/>
      <rect x="352" y="80" width="120" height="72" rx="16" fill="#101a3a" stroke="#2dd4bf"/>
      <rect x="40" y="360" width="120" height="72" rx="16" fill="#101a3a" stroke="#2dd4bf"/>
      <rect x="352" y="360" width="120" height="72" rx="16" fill="#0f1530" stroke="#4b5578"/>
    </g>
    <g fill="#2dd4bf">
      <rect x="66" y="108" width="68" height="8" rx="4"/>
      <rect x="378" y="108" width="68" height="8" rx="4"/>
      <rect x="66" y="388" width="68" height="8" rx="4"/>
    </g>
    <rect x="378" y="388" width="68" height="8" rx="4" fill="#4b5578"/>
    <rect x="196" y="220" width="120" height="72" rx="16" fill="#f5a524" filter="url(#hglow)"/>
    <rect x="196" y="220" width="120" height="72" rx="16" fill="#f5a524" stroke="#ffd58a" stroke-width="4"/>
    <rect x="222" y="248" width="68" height="10" rx="5" fill="#0b1020"/>
  </g>

  <!-- wordmark -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="440" y="178" font-size="104" font-weight="800" letter-spacing="-3" fill="#f4f1ea">syste<tspan fill="#f5a524">map</tspan></text>
    <text x="444" y="236" font-size="30" font-weight="500" fill="#aab3d1">The map your coding agent draws of your system.</text>
    <g font-size="20" font-weight="600" fill="#2dd4bf">
      <rect x="444" y="272" width="190" height="42" rx="21" fill="none" stroke="#2dd4bf" stroke-width="2"/>
      <text x="539" y="299" text-anchor="middle">extract the facts</text>
      <rect x="650" y="272" width="212" height="42" rx="21" fill="none" stroke="#2dd4bf" stroke-width="2"/>
      <text x="756" y="299" text-anchor="middle">author the meaning</text>
      <rect x="878" y="272" width="266" height="42" rx="21" fill="none" stroke="#2dd4bf" stroke-width="2"/>
      <text x="1011" y="299" text-anchor="middle">refuse an incomplete map</text>
    </g>
  </g>
</svg>
