# The configuration for the systemap map.
# Exact answer lines identify recorded findings. Their quoted identities stay unchanged.
name = "systemap"
tests_dir = "tests"
model = "map/model.py"
out_dir = "docs/map"
[package_roots]
"src/systemap" = "systemap"

[coverage]
ignore = []

# Configured mechanisms give structural evidence only.
[flows]
observed_by = ["facts file"]

[[figures]]
out = "figures/structure.svg"
mode = "system"
interactive = false
layer = "structure"

[[figures]]
out = "figures/control.svg"
mode = "system"
interactive = false
layer = "control"

[[figures]]
out = "figures/system.svg"
mode = "system"
interactive = false

# Exact answers must have current evidence digests after source examination.
[judgement]
answered = [
    { item = "single module: Scaffold contains only systemap.scaffold", evidence = "280eeb57a9aa69bd1f8705cc12521b8be4a83c44652bec523d936c6337f20734", reason = "scaffold.py writes the initial configuration, model, and workflow. This setup is a different function from map placement or rendering." },
    { item = "single module: Placer contains only systemap.place", evidence = "280eeb57a9aa69bd1f8705cc12521b8be4a83c44652bec523d936c6337f20734", reason = "place.py calculates card positions. route.py calculates flow paths and label positions. The two components have different functions." },
    { item = "single module: Skill contains only systemap.skill", evidence = "280eeb57a9aa69bd1f8705cc12521b8be4a83c44652bec523d936c6337f20734", reason = "skill.py installs the mapping procedure. scaffold.py writes the initial project files. The procedure is a different component." },
    { item = "single module: Router contains only systemap.route", evidence = "280eeb57a9aa69bd1f8705cc12521b8be4a83c44652bec523d936c6337f20734", reason = "route.py calculates paths and label positions from card geometry. schematic.py renders the result. Router is a different component." },
    { item = "single module: Figures contains only systemap.figure", evidence = "280eeb57a9aa69bd1f8705cc12521b8be4a83c44652bec523d936c6337f20734", reason = "figure.py makes a selected SVG or HTML figure for a document. page.py makes the complete interactive page." },
    { item = "single module: Check contains only systemap.check", evidence = "280eeb57a9aa69bd1f8705cc12521b8be4a83c44652bec523d936c6337f20734", reason = "check.py applies consistency rules. judgement.py gives questions for source examination. The two components have different functions." },
    { item = "single module: Describe contains only systemap.describe", evidence = "280eeb57a9aa69bd1f8705cc12521b8be4a83c44652bec523d936c6337f20734", reason = "describe.py gives diagram text and measurements. schematic.py renders the diagram. check.py does consistency checks." },
    { item = "jev flow: CLI -> SecondOpinion ('audit, triage, --jev'): the code where they meet may not carry it", reason = "The CLI registers audit and triage through jev_cli.add_parsers and set_defaults. It calls jev_cli for delta --jev and suggest --jev. The recorded Jev input omitted dispatch registrations." },
    { item = "jev flow: Config -> Figures ('figures table'): the code where they meet may not carry it", reason = "config reads the figures table into Figure records. refresh gives each record to figure.render. The recorded Jev input contained the Figure type import only." },
    { item = "jev flow: FactsExtractor -> SecondOpinion ('map.json'): the code where they meet may not carry it", reason = "jev_cli reads the facts with extract.read_facts(cfg.facts_path). The recorded Jev input contained read_facts and is_empty_marker references, without the file transfer." },
    { item = "jev flow: Scaffold -> Model ('starter'): the code where they meet may not carry it", reason = "scaffold writes the initial map/model.py file once. It does not import the schema for this operation. The file is the artifact." },
    { items = [
        "jev mis-fold: SecondOpinion claims systemap.journeys, which reads like Skill",
        "jev mis-fold: SecondOpinion claims systemap.plan, which reads like none of the cards",
    ], reason = "SecondOpinion asks Jev about component selections and a coding agent about sequences. Both modules validate answers before file changes. Neither module reads or writes the installed skill." },
    { item = "jev governs: invariant 5 may govern Scaffold, which it does not name", reason = "The initial region positions are fixed template values. The scaffold writes them once and does not move cards." },
