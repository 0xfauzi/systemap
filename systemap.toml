# The configuration for the systemap map.
# Exact answer lines identify recorded findings. Their quoted identities stay unchanged.
name = "systemap"
tests_dir = "tests"
model = "map/model.py"
out_dir = "docs/map"
[package_roots]
"src/systemap" = "systemap"

[coverage]
ignore = []

# Configured mechanisms give structural evidence only.
[flows]
observed_by = ["facts file"]

# This repository uses the full ASD-STE100 Issue 9 rules (AGENTS.md, Language requirement).
[writing]
profile = "asd-ste100"

[[figures]]
out = "figures/structure.svg"
mode = "system"
interactive = false
layer = "structure"

[[figures]]
out = "figures/control.svg"
mode = "system"
interactive = false
layer = "control"

[[figures]]
out = "figures/system.svg"
mode = "system"
interactive = false

# Exact answers must have current evidence digests after source examination.
[judgement]
answered = [
    { item = "single module: Scaffold contains only systemap.scaffold", evidence = "1094c35402635260f62ca8dc4bc3094727e7bee4343436512f946fd3c9ecc6ea", reason = "scaffold.py writes the initial configuration, model, and workflow. This setup is a different function from map placement or rendering." },
    { item = "single module: Placer contains only systemap.place", evidence = "a2a739f17ee841303afc915d544e0eb150b82b914ecf19f6f2f0013544a8e395", reason = "place.py calculates card positions. route.py calculates flow paths and label positions. The two components have different functions." },
    { item = "single module: Skill contains only systemap.skill", evidence = "23bdf7f1a8235392eda400206a498490f5db7eff222c5b12b66c51b41d616eb5", reason = "skill.py installs the mapping procedure. scaffold.py writes the initial project files. The procedure is a different component." },
    { item = "single module: Router contains only systemap.route", evidence = "f58dedee3fc56d0055d1e19a1fe8658d6e26049c68d2a225c8e7e21f3c4e80da", reason = "route.py calculates paths and label positions from card geometry. schematic.py renders the result. Router is a different component." },
    { item = "single module: Figures contains only systemap.figure", evidence = "ab77f31f5bc86dab61b6e4d2122d43e257c3fe07cb67b8db562016215922f129", reason = "figure.py makes a selected SVG or HTML figure for a document. page.py makes the complete interactive page." },
    { item = "single module: Describe contains only systemap.describe", evidence = "c5bc3c3924647c16ae44db81f862fcee4a6732c8d2a0c2ac73b0468bcbf545ab", reason = "describe.py gives diagram text and measurements. schematic.py renders the diagram. check.py does consistency checks." },
    { item = "jev flow: CLI -> SecondOpinion ('audit, triage, --jev'): the code where they meet may not carry it", reason = "The CLI registers audit and triage through jev_cli.add_parsers and set_defaults. It calls jev_cli for delta --jev and suggest --jev. The recorded Jev input omitted dispatch registrations." },
    { item = "jev flow: Config -> Figures ('figures table'): the code where they meet may not carry it", reason = "config reads the figures table into Figure records. refresh gives each record to figure.render. The recorded Jev input contained the Figure type import only." },
    { item = "jev flow: FactsExtractor -> SecondOpinion ('map.json'): the code where they meet may not carry it", reason = "jev_cli reads the facts with extract.read_facts(cfg.facts_path). The recorded Jev input contained read_facts and is_empty_marker references, without the file transfer." },
    { item = "jev flow: Scaffold -> Model ('starter'): the code where they meet may not carry it", reason = "scaffold writes the initial map/model.py file once. It does not import the schema for this operation. The file is the artifact." },
    { items = [
        "jev mis-fold: SecondOpinion claims systemap.journeys, which reads like Skill",
        "jev mis-fold: SecondOpinion claims systemap.plan, which reads like none of the cards",
    ], reason = "SecondOpinion asks Jev about component selections and a coding agent about sequences. Both modules validate answers before file changes. Neither module reads or writes the installed skill." },
    { item = "jev governs: invariant 5 may govern Scaffold, which it does not name", reason = "The initial region positions are fixed template values. The scaffold writes them once and does not move cards." },
]
