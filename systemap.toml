# The configuration for the systemap map.
# Exact answer lines identify recorded findings. Their quoted identities stay unchanged.
name = "systemap"
tests_dir = "tests"
model = "map/model.py"
out_dir = "docs/map"
[package_roots]
"src/systemap" = "systemap"

[coverage]
ignore = []

# Configured mechanisms give structural evidence only.
[flows]
observed_by = ["facts file"]

# This repository uses the full ASD-STE100 Issue 9 rules (AGENTS.md, Language requirement).
[writing]
profile = "asd-ste100"

[[figures]]
out = "figures/structure.svg"
mode = "system"
interactive = false
layer = "structure"

[[figures]]
out = "figures/control.svg"
mode = "system"
interactive = false
layer = "control"

[[figures]]
out = "figures/system.svg"
mode = "system"
interactive = false

# Exact answers must have current evidence digests after source examination.
[judgement]
answered = [
    { item = "single module: Scaffold contains only systemap.scaffold", evidence = "3bbf472fb86bd8693ce54105ba3ec37e11ac4a302205a6b3f69431de041a9187", reason = "scaffold.py writes the initial configuration, model, contract file, and workflow. This setup is a different function from map placement or rendering." },
    { item = "single module: Skill contains only systemap.skill", evidence = "4410aeb7c880c45e734d18f0d77766b0c23377d99605d12949aa34799c5b88ce", reason = "skill.py installs the mapping procedure. scaffold.py writes the initial project files. The procedure is a different component." },
    { item = "single module: Figures contains only systemap.figure", evidence = "1a5e8a9c381a88821069802fb2bbe3cfd95d4a6ebf27fbb9a4dfac133b80acfc", reason = "figure.py makes a selected SVG or HTML figure for a document. page.py makes the complete interactive page." },
    { item = "module use: other components import systemap.config and no flow connects them to its component", role = "mixed", handoff = ["Config", "load"], evidence = "9dad698b60e86fe0a38c0eba252ed950df8dfad941f1258a9e4230f961724a41", reason = "load reads systemap.toml and gives the Config record to the other components. ConfigError is an exception class. It operates in the code of the caller and sends no configuration value." },
    { item = "module use: other components import systemap.repo_files and no flow connects them to its component", role = "helper", symbol = "inside", evidence = "12245823111450e124b801b8b3e76f58eae420798d0a7dbb6f9c96242380f5fd", reason = "inside resolves a path and tells if it is in the root. It operates in the code of the caller and sends no artifact." },
    { item = "single module: Describe contains only systemap.describe", evidence = "bc479285d4484294b8bb3889811ace8b0dae9b6bf1e13d353df116599ce47e13", reason = "describe.py gives diagram text and measurements. schematic.py renders the diagram. check.py does consistency checks." },
    { item = "decision flow: CLI -> SecondOpinion ('audit, triage, --jev'): the code where they meet may not carry it", reason = "The CLI registers audit and triage through jev_cli.add_parsers and set_defaults. It calls jev_cli for delta --decide and suggest --decide. The recorded Jev input omitted dispatch registrations." },
    { item = "decision flow: Config -> Figures ('figures table'): the code where they meet may not carry it", reason = "config reads the figures table into Figure records. refresh gives each record to figure.render. The recorded Jev input contained the Figure type import only." },
    { item = "decision flow: FactsExtractor -> SecondOpinion ('map.json'): the code where they meet may not carry it", reason = "jev_cli reads the facts with facts_file.read_facts(cfg.facts_path, cfg.root). The recorded Jev input contained read_facts and is_empty_marker references, without the file transfer." },
    { item = "decision flow: Scaffold -> Model ('starter'): the code where they meet may not carry it", reason = "scaffold writes the initial map/model.py file once. It does not import the schema for this operation. The file is the artifact." },
    { items = [
        "decision mis-fold: SecondOpinion claims systemap.journeys",
        "decision mis-fold: SecondOpinion claims systemap.plan",
    ], reason = "SecondOpinion asks Jev about component selections and a coding agent about sequences. Both modules validate answers before file changes. Neither module reads or writes the installed skill." },
    { item = "decision governs: invariant 5 may govern Scaffold, which it does not name", reason = "The initial region positions are fixed template values. The scaffold writes them once and does not move cards." },
]
