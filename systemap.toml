# The configuration for the systemap map.
# Exact answer lines identify recorded findings. Their quoted identities stay unchanged.
name = "systemap"
tests_dir = "tests"
model = "map/model.py"
out_dir = "docs/map"
[package_roots]
"src/systemap" = "systemap"

[coverage]
ignore = []

# Configured mechanisms give structural evidence only.
[flows]
observed_by = ["facts file"]

# This repository uses the full ASD-STE100 Issue 9 rules (AGENTS.md, Language requirement).
[writing]
profile = "asd-ste100"

[[figures]]
out = "figures/structure.svg"
mode = "system"
interactive = false
layer = "structure"

[[figures]]
out = "figures/control.svg"
mode = "system"
interactive = false
layer = "control"

[[figures]]
out = "figures/system.svg"
mode = "system"
interactive = false

# Exact answers must have current evidence digests after source examination.
[judgement]
answered = [
    { item = "single module: Scaffold contains only systemap.scaffold", evidence = "fc21e72e540e5e3402ef6c7a48d569c8e6994a5e129fc469f83cd758e674bb23", reason = "scaffold.py writes the initial configuration, model, and workflow. This setup is a different function from map placement or rendering." },
    { item = "single module: Placer contains only systemap.place", evidence = "efc667d522569726190264d3d864ee24e0fa99e34ca88f61d6529269d9ce9073", reason = "place.py calculates card positions. route.py calculates flow paths and label positions. The two components have different functions." },
    { item = "single module: Skill contains only systemap.skill", evidence = "9235d044eb51695f5158511fc8666d2bc314fdf90101a73eccd149127b616d34", reason = "skill.py installs the mapping procedure. scaffold.py writes the initial project files. The procedure is a different component." },
    { item = "single module: Router contains only systemap.route", evidence = "61212b3a4587779309a742efbc9703a9c42892e8a4bab2308f80e04a13d33aaf", reason = "route.py calculates paths and label positions from card geometry. schematic.py renders the result. Router is a different component." },
    { item = "single module: Figures contains only systemap.figure", evidence = "2969bdb12fe3b6785bae42b5bfeb32d49412b341be8e3fef202a8d04a6e522f8", reason = "figure.py makes a selected SVG or HTML figure for a document. page.py makes the complete interactive page." },
    { item = "crossing import: Skill imports Config in 1 module and no flow connects them", evidence = "a48de71903b489e30702b635dfd0b42f1c58c4e6c8814465981caff06fcccf31", reason = "skill.py uses repo_files.inside and ConfigError to refuse a symbolic link before a write. No configuration value goes from Config to Skill." },
    { item = "single module: Describe contains only systemap.describe", evidence = "214997ce472ccef4021ebef4b65fa641b6607f339098efc34ead51a9873ef8fb", reason = "describe.py gives diagram text and measurements. schematic.py renders the diagram. check.py does consistency checks." },
    { item = "decision flow: CLI -> SecondOpinion ('audit, triage, --jev'): the code where they meet may not carry it", reason = "The CLI registers audit and triage through jev_cli.add_parsers and set_defaults. It calls jev_cli for delta --jev and suggest --jev. The recorded Jev input omitted dispatch registrations." },
    { item = "decision flow: Config -> Figures ('figures table'): the code where they meet may not carry it", reason = "config reads the figures table into Figure records. refresh gives each record to figure.render. The recorded Jev input contained the Figure type import only." },
    { item = "decision flow: FactsExtractor -> SecondOpinion ('map.json'): the code where they meet may not carry it", reason = "jev_cli reads the facts with extract.read_facts(cfg.facts_path). The recorded Jev input contained read_facts and is_empty_marker references, without the file transfer." },
    { item = "decision flow: Scaffold -> Model ('starter'): the code where they meet may not carry it", reason = "scaffold writes the initial map/model.py file once. It does not import the schema for this operation. The file is the artifact." },
    { items = [
        "decision mis-fold: SecondOpinion claims systemap.journeys",
        "decision mis-fold: SecondOpinion claims systemap.plan",
    ], reason = "SecondOpinion asks Jev about component selections and a coding agent about sequences. Both modules validate answers before file changes. Neither module reads or writes the installed skill." },
    { item = "decision governs: invariant 5 may govern Scaffold, which it does not name", reason = "The initial region positions are fixed template values. The scaffold writes them once and does not move cards." },
]
