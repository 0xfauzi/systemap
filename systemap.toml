# The configuration for the systemap map.
# Exact answer lines identify recorded findings. Their quoted identities stay unchanged.
name = "systemap"
tests_dir = "tests"
model = "map/model.py"
out_dir = "docs/map"
[package_roots]
"src/systemap" = "systemap"

[coverage]
ignore = []

# Configured mechanisms give structural evidence only.
[flows]
observed_by = ["facts file"]

# This repository uses the full ASD-STE100 Issue 9 rules (AGENTS.md, Language requirement).
[writing]
profile = "asd-ste100"

[[figures]]
out = "figures/structure.svg"
mode = "system"
interactive = false
layer = "structure"

[[figures]]
out = "figures/control.svg"
mode = "system"
interactive = false
layer = "control"

[[figures]]
out = "figures/system.svg"
mode = "system"
interactive = false

# Exact answers must have current evidence digests after source examination.
[judgement]
answered = [
    { item = "single module: Scaffold contains only systemap.scaffold", evidence = "7ab8c3f9905755f4b7c6f668a05c83dce9fb8010fd449ac3f8170997a1be8697", reason = "scaffold.py writes the initial configuration, model, and workflow. This setup is a different function from map placement or rendering." },
    { item = "single module: Placer contains only systemap.place", evidence = "2082c9fdc93d40ce8cabc7471c594bc0ba7fd60e757823d2de1f12e485471f5f", reason = "place.py calculates card positions. route.py calculates flow paths and label positions. The two components have different functions." },
    { item = "single module: Skill contains only systemap.skill", evidence = "ff9331744b456d76f2368772a013d75ae305edd599ae6bc0ef4d810fe8d59070", reason = "skill.py installs the mapping procedure. scaffold.py writes the initial project files. The procedure is a different component." },
    { item = "single module: Router contains only systemap.route", evidence = "bfffec1bb9393beab0066e5166bd1cf96954c5920029369c2be4818b58429872", reason = "route.py calculates paths and label positions from card geometry. schematic.py renders the result. Router is a different component." },
    { item = "single module: Figures contains only systemap.figure", evidence = "2b045a3addecfb53d64c2b943ebc14ede4fc7eab9da9e2529fe32f0aaf97f836", reason = "figure.py makes a selected SVG or HTML figure for a document. page.py makes the complete interactive page." },
    { item = "single module: Describe contains only systemap.describe", evidence = "a9840620552d76db50d2685023d25982318564c3deb73b7b4223fc041e5f6ddd", reason = "describe.py gives diagram text and measurements. schematic.py renders the diagram. check.py does consistency checks." },
    { item = "decision flow: CLI -> SecondOpinion ('audit, triage, --jev'): the code where they meet may not carry it", reason = "The CLI registers audit and triage through jev_cli.add_parsers and set_defaults. It calls jev_cli for delta --jev and suggest --jev. The recorded Jev input omitted dispatch registrations." },
    { item = "decision flow: Config -> Figures ('figures table'): the code where they meet may not carry it", reason = "config reads the figures table into Figure records. refresh gives each record to figure.render. The recorded Jev input contained the Figure type import only." },
    { item = "decision flow: FactsExtractor -> SecondOpinion ('map.json'): the code where they meet may not carry it", reason = "jev_cli reads the facts with facts_file.read_facts(cfg.facts_path). The recorded Jev input contained read_facts and is_empty_marker references, without the file transfer." },
    { item = "decision flow: Scaffold -> Model ('starter'): the code where they meet may not carry it", reason = "scaffold writes the initial map/model.py file once. It does not import the schema for this operation. The file is the artifact." },
    { items = [
        "decision mis-fold: SecondOpinion claims systemap.journeys",
        "decision mis-fold: SecondOpinion claims systemap.plan",
    ], reason = "SecondOpinion asks Jev about component selections and a coding agent about sequences. Both modules validate answers before file changes. Neither module reads or writes the installed skill." },
    { item = "decision governs: invariant 5 may govern Scaffold, which it does not name", reason = "The initial region positions are fixed template values. The scaffold writes them once and does not move cards." },
]
