# systemap's own map. Every key is optional; these are the ones this
# repository sets.
name = "systemap"
tests_dir = "tests"
model = "map/model.py"
out_dir = "docs/map"
# The table comes last among the plain keys: a key written under it
# would be read as a package root, not as itself.
[package_roots]
"src/systemap" = "systemap"

# Every module is claimed by a component; the package root is claimed by
# the Model card, since it re-exports the schema. Nothing is ignored.
[coverage]
ignore = []

# The mechanisms other than an import that join this package's parts. The
# facts file is written by extract and read back by every command, so a
# flow whose sentence names it is observed by it, not declared.
[flows]
observed_by = ["facts file"]

# The figures the README embeds, each the bare drawing on its ground, as an
# image. Structure is the calm picture (regions and parts, no arrows) and
# Control flow one reading; the whole map, every layer at once, is kept
# for documents that cite it.
[[figures]]
out = "figures/structure.svg"
mode = "system"
interactive = false
layer = "structure"

[[figures]]
out = "figures/control.svg"
mode = "system"
interactive = false
layer = "control"

[[figures]]
out = "figures/system.svg"
mode = "system"
interactive = false

# The judgement lines the maintainer has answered, with why. An answered
# line is suppressed and counted; an answer that matches no line is reported
# as stale, so the list below cannot outlive the map it answers. A family of
# lines with one reason is answered by its form: every line of a kind, or
# every crossing import between two components.
[judgement]
answered = [
    { kind = "single module", reason = "a small package with one module per part: each card is a thing a reader would point at and name, and folding two of them would draw one card for two jobs" },
    { crossing = ["CLI", "Model"], reason = "the CLI imports the schema for type names, the version, and the placement check it runs before it renders; MODEL and MEANING reach the commands through Config (the settings edge), which is where the map draws them" },
    { crossing = ["Config", "Model"], reason = "load_model imports the schema only to check that MODEL and MEANING are the right types; the model flows on to the commands as settings, not back into the configuration" },
    { items = [
        "crossing import: Figures imports Model in 1 module and no flow joins them",
        "crossing import: Page imports Model in 1 module and no flow joins them",
    ], reason = "the drawers import the schema for type names and the layer order, and the tree of maps for the link a card that opens a map carries; the model itself reaches them through the Schematic (topology, meaning), which the map draws" },
    { crossing = ["Describe", "Model"], reason = "describe imports the schema for the layer table and the readings it counts; the model reaches it as the Schematic's geometry, which the map draws" },
    { item = "declared flow: ChangeDetector -> Page (change map): no import joins them; find the evidence, name the mechanism in the sentence, or remove it", reason = "the change map is computed by the detector and handed to the page by the CLI (render --base); the page never imports the detector, and the hand-over is the CLI's control edge to each" },
    { crossing = ["ChangeDetector", "Judgement"], reason = "delta reuses the judgement's answer matcher so a crossing import already answered under [judgement] is not asked again; the answers themselves reach the detector through Config (the settings edge), which the map draws" },
]
